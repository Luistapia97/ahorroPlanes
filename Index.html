  /* ---------------- RENDER: CALENDAR ---------------- */
  const DOWS = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

  function renderCalendarView(){
    const y = calDate.getFullYear(), m = calDate.getMonth();
    const firstDow = new Date(y,m,1).getDay();
    const daysInMonth = new Date(y,m+1,0).getDate();
    const todayStr = todayISO();

    const activitiesByDay = {};
    state.activities.filter(activity=>activity.date.slice(0,7)===`${y}-${String(m+1).padStart(2,'0')}`).forEach(activity=>{
      (activitiesByDay[Number(activity.date.slice(8,10))] ||= []).push(activity);
    });
    const monthKey = `${y}-${String(m+1).padStart(2,'0')}`;
    const monthTasks = sortTasks(state.tasks.filter(task=>task.dueDate && task.dueDate.slice(0,7)===monthKey));
    const tasksByDay = {};
    monthTasks.forEach(task=>{ (tasksByDay[Number(task.dueDate.slice(8,10))] ||= []).push(task); });

    // map day -> plans due that day
    const dayMap = {};
    state.plans.forEach(p=>{
      const d = new Date(p.targetDate+'T00:00:00');
      if(d.getFullYear()===y && d.getMonth()===m){
        const day = d.getDate();
        (dayMap[day] = dayMap[day]||[]).push(p);
      }
    });

    let cells = '';
    for(let i=0;i<firstDow;i++) cells += `<div class="cal-day empty"></div>`;
    for(let day=1; day<=daysInMonth; day++){
      const dateStr = y+'-'+String(m+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
      const isToday = dateStr===todayStr;
      const items = dayMap[day]||[];
      const entries = [
        ...(activitiesByDay[day]||[]).map(activity=>({label:escapeHtml(activity.title), color:activityColor(activity.color), cls:''})),
        ...(tasksByDay[day]||[]).map(task=>({label:(task.status==='hecha'?'✓ ':'◻ ')+escapeHtml(task.title), color:'var(--teal-2)', cls:'task'+(task.status==='hecha'?' done':'')}))
      ];
      cells += `
        <div class="cal-day ${isToday?'today':''}" data-action="add-activity" data-date="${dateStr}" title="Agregar actividad">
          <span class="cal-day-num">${day}</span>
          <div class="cal-activities">
            ${entries.slice(0,2).map(entry=>`<div class="cal-activity ${entry.cls}" style="--activity-color:${entry.color}"><span class="cal-activity-dot"></span><span class="cal-activity-label">${entry.label}</span></div>`).join('')}
            ${entries.length>2?`<span class="cal-activity-more">+${entries.length-2} más</span>`:''}
            ${items.length?`<span class="cal-emojis">${items.map(p=>(CATEGORIES[p.category]||CATEGORIES.otro).emoji).join(' ')}</span>`:''}
          </div>
        </div>`;
    }

    // due this month, sorted
    const dueThisMonth = state.plans.filter(p=>{
      const d = new Date(p.targetDate+'T00:00:00');
      return d.getFullYear()===y && d.getMonth()===m;
    }).sort((a,b)=> new Date(a.targetDate)-new Date(b.targetDate));

    // suggested contributions this month: active plans not yet completed
    const thisMonthKey = y+'-'+String(m+1).padStart(2,'0');
    const suggestions = state.plans.filter(p=>computeQuote(p).status!=='done').map(p=>{
      const q = computeQuote(p);
      const contributedThisMonth = p.contributions.some(c=>c.date.slice(0,7)===thisMonthKey);
      return {p,q,contributedThisMonth};
    }).sort((a,b)=> new Date(a.p.targetDate)-new Date(b.p.targetDate));

    return `
      <div class="topbar">
        <div>
          <h1 class="page-title">Calendario</h1>
          <p class="page-sub">Visualiza cuándo vencen tus planes, las tareas de tus proyectos y qué aportes te tocan este mes.</p>
        </div>
        <button class="btn btn-primary" data-action="new-plan">${iconPlus()} Nuevo plan</button>
      </div>

      <div class="cal-wrap">
        <div class="cal-card">
          <div class="cal-head">
            <div class="cal-month">${MONTHS[m]} ${y}</div>
            <div class="cal-nav">
              <button class="btn-icon" data-action="cal-prev">${iconChevron('left')}</button>
              <button class="btn-icon" data-action="cal-today" title="Hoy">${iconDot()}</button>
              <button class="btn-icon" data-action="cal-next">${iconChevron('right')}</button>
            </div>
          </div>
          <div class="cal-grid">
            ${DOWS.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
            ${cells}
          </div>
        </div>

        <div class="side-list">
          <div class="agenda-card">
            <h3 class="agenda-title">Vencen este mes</h3>
            ${dueThisMonth.length ? dueThisMonth.map(p=>{
              const cat = CATEGORIES[p.category]||CATEGORIES.otro;
              return `<div class="agenda-item">
                <div class="agenda-emoji">${cat.emoji}</div>
                <div>
                  <div class="agenda-name">${escapeHtml(p.name)}</div>
                  <div class="agenda-sub">${fmtDate(p.targetDate)}</div>
                </div>
              </div>`;
            }).join('') : `<div class="muted-empty">Ningún plan vence este mes.</div>`}
          </div>

          ${monthTasks.length ? `<div class="agenda-card">
            <h3 class="agenda-title">Tareas de Emprende en ${MONTHS[m]}</h3>
            ${monthTasks.map(task=>{
              const venture = state.ventures.find(item=>item.id===task.ventureId);
              const done = task.status==='hecha';
              return `<div class="agenda-item">
                <div class="agenda-emoji">${done ? '✅' : '📌'}</div>
                <div style="min-width:0;flex:1;">
                  <div class="agenda-name">${escapeHtml(task.title)}</div>
                  <div class="agenda-sub">${fmtDate(task.dueDate)} · ${escapeHtml(venture?.name || '')} · ${PARTNERS[task.assignee] || 'Ambos'}</div>
                </div>
                <button class="btn btn-ghost btn-sm" data-action="open-task-venture" data-id="${task.ventureId}">Abrir</button>
              </div>`;
            }).join('')}
          </div>` : ''}

          <div class="agenda-card">
            <h3 class="agenda-title">Aportes sugeridos de ${MONTHS[m]}</h3>
            ${suggestions.length ? suggestions.map(s=>{
              const cat = CATEGORIES[s.p.category]||CATEGORIES.otro;
              return `<div class="agenda-item">
                <div class="agenda-emoji">${cat.emoji}</div>
                <div>
                  <div class="agenda-name">${escapeHtml(s.p.name)}</div>
                  <div class="agenda-sub">${fmtMoney(s.q.monthly)} / mes</div>
                </div>
                <span class="agenda-check ${s.contributedThisMonth?'done':'pending'}">${s.contributedThisMonth?'Hecho':'Pendiente'}</span>
              </div>`;
            }).join('') : `<div class="muted-empty">Agrega un plan para ver sugerencias.</div>`}
          </div>
        </div>
      </div>
    `;
  }

  const FLOW_OPTIONS=[['none','Sin flujo'],['light','Ligero'],['medium','Medio'],['heavy','Abundante']];
  const SYMPTOM_OPTIONS=[['cramps','Cólicos'],['headache','Dolor de cabeza'],['tender_breasts','Pecho sensible'],['backache','Dolor lumbar'],['fatigue','Cansancio']];
  const MOOD_OPTIONS=[['happy','Feliz'],['sad','Triste'],['sensitive','Sensible'],['calm','Tranquila'],['irritable','Irritable']];

  function renderMenstrualView(){
    const menstrual=state.menstrual;
    const prediction=MenstrualEngineService.getPrediction(menstrual.cycles,menstrual.preferences,menstrual.dailyLogs);
    const pregnancyRisk=MenstrualEngineService.estimatePregnancyRisk(prediction, menstrual.dailyLogs);
    const y=calDate.getFullYear(),m=calDate.getMonth(),firstDow=new Date(y,m,1).getDay(),daysInMonth=new Date(y,m+1,0).getDate();
    const today=todayISO();
    const logsByDate=Object.fromEntries(menstrual.dailyLogs.map(log=>[log.date,log]));
    const predictedDates=new Set(), rangeDates=new Set();
    if(prediction.nextPeriodEarliest){ for(let date=prediction.nextPeriodEarliest; date<=prediction.nextPeriodLatest; date=MenstrualEngineService.addDays(date,1)) rangeDates.add(date); }
    // Ovulaciones confirmadas por señales (LH, temperatura o moco) en todos los ciclos registrados.
    const confirmedOvulations=new Map();
    menstrual.cycles.forEach(cycle=>{ const detected=MenstrualEngineService.detectOvulation(cycle,menstrual.dailyLogs); if(detected) confirmedOvulations.set(detected.date,detected.source); });
    if(prediction.nextPeriod){ for(let day=0;day<prediction.periodLength;day++) predictedDates.add(MenstrualEngineService.addDays(prediction.nextPeriod,day)); }
    // Días de periodo ya vividos: del inicio de cada ciclo hasta su fin marcado o deducido.
    const periodDates=new Set(), periodEndDates=new Set();
    menstrual.cycles.forEach(cycle=>{
      const end=MenstrualEngineService.getPeriodEnd(cycle,menstrual.dailyLogs);
      if(!end) return;
      for(let day=0;day<=MenstrualEngineService.daysBetween(cycle.startDate,end.date);day++) periodDates.add(MenstrualEngineService.addDays(cycle.startDate,day));
      if(end.explicit) periodEndDates.add(end.date);
    });
    let cells='';
    for(let i=0;i<firstDow;i++) cells+='<div class="cal-day empty"></div>';
    for(let day=1;day<=daysInMonth;day++){
      const date=`${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`,log=logsByDate[date];
      const fertile=prediction.fertileStart&&date>=prediction.fertileStart&&date<=prediction.fertileEnd;
      const confirmed=confirmedOvulations.has(date), ovulation=confirmed || date===prediction.ovulation, predicted=predictedDates.has(date), hasFlow=log&&log.flowIntensity!=='none';
      const inRange=rangeDates.has(date) && !predicted;
      const signalMark=`${log?.lhTest==='positive'?'<span class="signal-mark" title="Prueba de ovulación positiva">🧪</span>':''}${['eggwhite','watery'].includes(log?.cervicalMucus)?'<span class="signal-mark" title="Moco fértil">💧</span>':''}`;
      const sexMark = log?.hadSex ? `<span class="sex-mark ${log.protectionUsed===false?'unprotected':''}" title="${log.protectionUsed===false?'Relación sin protección':'Relación con protección'}">${log.protectionUsed===false?'❤':'🛡'}</span>` : '';
      cells+=`<button class="cal-day cycle-day ${date===today?'today ':''}${periodDates.has(date)?'period ':''}${periodEndDates.has(date)?'period-end ':''}${fertile?'fertile ':''}${ovulation?'ovulation ':''}${predicted?'predicted ':''}${inRange?'predicted-range':''}" data-action="daily-log" data-date="${date}" title="Registrar día">
        <span class="cycle-day-number"><span>${day}</span><span style="display:flex;align-items:center;gap:4px;">${hasFlow?'<span class="flow-mark"></span>':''}${signalMark}${sexMark}</span></span>
        ${ovulation?`<span class="cycle-day-label ${confirmed?'confirmed':''}">${confirmed?'Ovulación ✓':'Ovulación'}</span>`:''}
        ${fertile&&!ovulation?'<span class="cycle-day-label">Fértil</span>':''}
      </button>`;
    }
    const periodDays=menstrual.dailyLogs.filter(log=>log.flowIntensity!=='none').length;
    return `<div class="topbar"><div><h1 class="page-title">Mi ciclo</h1><p class="page-sub">Registra cómo te sientes y conoce tus patrones con privacidad por cuenta.</p></div><button class="btn btn-primary" data-action="daily-log" data-date="${today}">${iconPlus()} Registrar hoy</button></div>
      <div class="menstrual-layout">
        <div class="cycle-calendar"><div class="cal-head"><div class="cal-month">${MONTHS[m]} ${y}</div><div class="cal-nav"><button class="btn-icon" data-action="cycle-prev">${iconChevron('left')}</button><button class="btn-icon" data-action="cycle-today" title="Hoy">${iconDot()}</button><button class="btn-icon" data-action="cycle-next">${iconChevron('right')}</button></div></div><div class="cal-grid cycle-grid">${DOWS.map(d=>`<div class="cal-dow">${d}</div>`).join('')}${cells}</div><div class="cycle-legend"><span><i class="legend-dot"></i>Día con flujo</span><span><i class="legend-period"></i>Periodo</span><span><i class="legend-ring"></i>Periodo estimado</span><span><i class="legend-range"></i>Posible inicio</span><span><i class="legend-sex">🧪</i>LH positiva</span><span><i class="legend-sex">💧</i>Moco fértil</span><span><i class="legend-blue"></i>Ovulación / fértil</span><span><i class="legend-sex">❤</i>Sin protección</span><span><i class="legend-sex">🛡</i>Con protección</span></div></div>
        <div><div class="prediction-card"><h3 class="agenda-title">Tu ciclo</h3>${prediction.current?`<div class="prediction-main">Día ${prediction.cycleDay} de tu ciclo</div><div class="prediction-sub">${nextPeriodText(prediction,today)}</div><span class="pregnancy-pill ${pregnancyRisk.level}">${pregnancyRisk.label} · ${pregnancyRisk.probability}%</span>${currentPeriodRow(prediction,today)}<div class="prediction-meta"><div><small>Próximo periodo</small><b>${fmtDate(prediction.nextPeriodEarliest)} - ${fmtDate(prediction.nextPeriodLatest)}</b></div><div><small>Ciclo / periodo</small><b>${prediction.average} días / ${prediction.periodLength} días</b></div><div><small>Ovulación ${prediction.detectedOvulation?'detectada':'estimada'}</small><b>${fmtDate(prediction.ovulation)}${prediction.detectedOvulation?` · ${OVULATION_SOURCES[prediction.detectedOvulation.source]}`:''}</b></div><div><small>Ventana fértil</small><b>${fmtDate(prediction.fertileStart)} - ${fmtDate(prediction.fertileEnd)}</b></div></div>`:'<div class="prediction-main">Comienza tu seguimiento</div><div class="prediction-sub">Registra tu primer día de sangrado para calcular predicciones personalizadas.</div>'}${prediction.current?`<p class="cycle-note" style="color:#c7d6cc;">${predictionBasisText(prediction)}</p>`:''}<p class="cycle-note" style="color:#c7d6cc;">Estimación orientativa según días fértiles, ovulación y uso de protección. No reemplaza una prueba ni asesoría médica.</p></div>
          <div class="tracking-card"><h3 class="agenda-title">Registro rápido</h3><p class="cycle-note">Selecciona una fecha del calendario o registra hoy.</p><button class="btn btn-gold" data-action="daily-log" data-date="${today}" style="margin-top:14px;width:100%;justify-content:center;">Registrar estado de hoy</button><div class="cycle-note">${periodDays?`${periodDays} día(s) con flujo registrado en tus datos.`:'Aún no hay días con flujo registrado.'}</div></div>
          ${cycleHistoryCard(menstrual)}</div>
      </div>`;
  }

  const OVULATION_SOURCES={lh:'prueba LH', bbt:'temperatura', mucus:'moco cervical'};

  function nextPeriodText(prediction, today){
    const days=MenstrualEngineService.daysBetween(today,prediction.nextPeriod);
    if(days<-prediction.margin) return `Tu periodo se ha retrasado ${-days} días respecto a lo esperado.`;
    if(days<=0) return 'Tu periodo podría llegar en cualquier momento.';
    return `Tu periodo llega en unos ${days} días (${fmtDate(prediction.nextPeriod)}, ±${prediction.margin} día${prediction.margin===1?'':'s'}).`;
  }

  function predictionBasisText(prediction){
    const cycles=prediction.cycleCount ? `${prediction.cycleCount} ciclo${prediction.cycleCount===1?'':'s'} completo${prediction.cycleCount===1?'':'s'}` : 'valores típicos (aún no hay ciclos completos)';
    const luteal=prediction.luteal.fromData ? `fase lútea de ${prediction.luteal.length} días según tus señales` : 'fase lútea típica de 14 días; registra pruebas LH, temperatura o moco para afinarla';
    return `Calculado con ${cycles} y ${luteal}.`;
  }

  function currentPeriodRow(prediction, today){
    const cycle=prediction.current, end=prediction.currentPeriodEnd;
    if(MenstrualEngineService.daysBetween(cycle.startDate,today)>13 && !end) return '';
    const text=end?.explicit ? `Periodo del <b>${fmtDate(cycle.startDate)}</b> al <b>${fmtDate(end.date)}</b> (${MenstrualEngineService.daysBetween(cycle.startDate,end.date)+1} días)`
      : `Periodo desde el <b>${fmtDate(cycle.startDate)}</b>. ¿Ya terminó? Marca el último día de sangrado.`;
    return `<div class="period-row"><span>${text}</span><button class="btn btn-sm btn-on-dark" data-action="period-end" data-id="${cycle.id}">${end?.explicit?'Cambiar':'Marcar fin'}</button></div>`;
  }

  function cycleHistoryCard(menstrual){
    const cycles=[...menstrual.cycles].sort((a,b)=>b.startDate.localeCompare(a.startDate)).slice(0,6);
    if(!cycles.length) return '';
    return `<div class="tracking-card cycle-history"><h3 class="agenda-title">Historial de ciclos</h3>
      ${cycles.map(cycle=>{
        const end=MenstrualEngineService.getPeriodEnd(cycle,menstrual.dailyLogs);
        const periodText=end ? `${MenstrualEngineService.daysBetween(cycle.startDate,end.date)+1} días de periodo${end.explicit?'':' <span class="estimate-tag">(según registros)</span>'}` : 'Sin fin de periodo';
        const cycleText=cycle.endDate ? `ciclo de ${cycle.cycleLength} días` : 'ciclo en curso';
        return `<div class="agenda-item">
          <div class="agenda-emoji">🩸</div>
          <div style="min-width:0;flex:1;">
            <div class="agenda-name">${fmtDate(cycle.startDate)}</div>
            <div class="agenda-sub">${periodText} · ${cycleText}</div>
          </div>
          <button class="btn btn-ghost btn-sm" data-action="period-end" data-id="${cycle.id}">${end?.explicit?'Editar fin':'Marcar fin'}</button>
        </div>`;
      }).join('')}
      <p class="cycle-note">Marcar el último día de sangrado de cada periodo hace que la duración estimada se ajuste a ti en lugar de usar 5 días fijos.</p>
    </div>`;
  }

  function openPeriodEndForm(cycle){
    const today=todayISO();
    const suggested=MenstrualEngineService.getPeriodEnd(cycle,state.menstrual.dailyLogs)?.date || (today<MenstrualEngineService.addDays(cycle.startDate,13) ? today : MenstrualEngineService.addDays(cycle.startDate,4));
    let max=MenstrualEngineService.addDays(cycle.startDate,13);
    if(cycle.endDate && cycle.endDate<=max) max=MenstrualEngineService.addDays(cycle.endDate,-1);
    if(today<max) max=today;
    openModal(`<div class="modal-head"><h2 class="modal-title">Fin del periodo</h2><button class="modal-close" data-action="close-modal">✕</button></div>
      <p class="modal-note">Periodo que empezó el <b>${fmtDate(cycle.startDate)}</b>. Elige el último día en que hubo sangrado.</p>
      <form id="periodEndForm">
        <div class="field"><label>Último día de sangrado</label><input type="date" name="periodEnd" required min="${cycle.startDate}" max="${max}" value="${suggested>max?max:suggested}"></div>
        <div class="modal-actions">${cycle.periodEndDate?`<button type="button" class="btn btn-ghost" data-action="clear-period-end" data-id="${cycle.id}" style="color:var(--coral);margin-right:auto;">Quitar fecha</button>`:''}<button type="button" class="btn btn-ghost" data-action="close-modal">Cancelar</button><button type="submit" class="btn btn-primary">Guardar</button></div>
      </form>`);
    document.getElementById('periodEndForm').addEventListener('submit',async(event)=>{
      event.preventDefault();
      const date=new FormData(event.target).get('periodEnd');
      try{ await setPeriodEnd(cycle.id,date); await loadData(); showToast(`Periodo de ${MenstrualEngineService.daysBetween(cycle.startDate,date)+1} días guardado`); closeModal(); render(); }
      catch(error){ showToast('No se pudo guardar el fin del periodo.'); }
    });
  }

  /* ---------------- ICONS ---------------- */
  function iconPlus(){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>`; }
  function iconEdit(){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>`; }
  function iconChevron(dir){ const d = dir==='left' ? 'M15 18l-6-6 6-6' : 'M9 18l6-6-6-6'; return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`; }
  function iconDot(){ return `<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="5"/></svg>`; }

  function activityColor(color){
    return color==='teal' ? 'var(--teal-2)' : color==='coral' ? 'var(--coral)' : color==='sage' ? 'var(--sage)' : 'var(--gold)';
  }

  function escapeHtml(s){
    const d = document.createElement('div');
    d.textContent = s==null ? '' : s;
    return d.innerHTML;
  }

  /* ---------------- MODALS ---------------- */
  function openModal(html){
    document.getElementById('modalContent').innerHTML = html;
    document.getElementById('overlay').classList.add('show');
  }
  function closeModal(){
    document.getElementById('overlay').classList.remove('show');
  }

  function openPlanForm(existing){
    const isEdit = !!existing;
    const p = existing || { id:null, name:'', category:'otro', description:'', targetCost:'', targetDate:'', initial:'' };
    const catOptions = Object.entries(CATEGORIES).map(([k,v])=>`<option value="${k}" ${p.category===k?'selected':''}>${v.emoji} ${v.label}</option>`).join('');
    openModal(`
      <div class="modal-head">
        <h2 class="modal-title">${isEdit?'Editar plan':'Nuevo plan'}</h2>
        <button class="modal-close" data-action="close-modal">✕</button>
      </div>
      <form id="planForm">
        <div class="field">
          <label>Nombre del plan</label>
          <input type="text" name="name" required placeholder="Ej. Viaje a Oaxaca" value="${escapeHtml(p.name)}">
        </div>
        <div class="field-row">
          <div class="field">
            <label>Categoría</label>
            <select name="category">${catOptions}</select>
          </div>
          <div class="field">
            <label>Fecha objetivo</label>
            <input type="date" name="targetDate" required value="${p.targetDate||''}">
          </div>
        </div>
        <div class="field-row">

istro</button></div></form>`);

  // Cada criterio se califica de 1 a 5, donde 5 siempre es lo más favorable para la idea.
  const IDEA_CRITERIA = [
    {key:'interest',   label:'Interés',   hint:'5 = nos emociona mucho'},
    {key:'investment', label:'Inversión', hint:'5 = necesita poco dinero'},
    {key:'timeNeeded', label:'Tiempo',    hint:'5 = cabe en nuestra agenda'},

  function ideaScore(idea){
    const votes = state.ideaVotes.filter(vote=>vote.ideaId===idea.id);
    const mine = votes.find(vote=>vote.userId===currentUserId);
    const partner = votes.find(vote=>vote.userId!==currentUserId);
    if(!votes.length) return {votes, mine, partner, avg:null, byCriterion:{}};
    const byCriterion = Object.fromEntries(IDEA_CRITERIA.map(c=>[c.key, votes.reduce((s,vote)=>s+vote[c.key],0)/votes.length]));
    const avg = Object.values(byCriterion).reduce((s,value)=>s+value,0)/IDEA_CRITERIA.length;
    return {votes, mine, partner, avg, byCriterion};
  }

  function ventureBudget(venture){
    const items = state.budgetItems.filter(item=>item.ventureId===venture.id);
    const total = items.reduce((s,item)=>s+item.amount,0);
    const paid = items.filter(item=>item.paid).reduce((s,item)=>s+item.amount,0);
    const perPartner = {luis:0, isabel:0};
    items.forEach(item=>{
      if(item.fundedBy==='ambos'){ perPartner.luis += item.amount/2; perPartner.isabel += item.amount/2; }
      else perPartner[item.fundedBy] += item.amount;
    });
    return {items, total, paid, pending:total-paid, perPartner, pct: total>0 ? Math.round((paid/total)*100) : 0};
  }

    return [...tasks].sort((a,b)=>(a.dueDate||'9999-12-31').localeCompare(b.dueDate||'9999-12-31') || (a.createdAt||'').localeCompare(b.createdAt||''));

  function taskDue(task){
    if(!task.dueDate) return null;
    const today = todayISO();
    if(task.status!=='hecha' && task.dueDate<today) return {label:'Vencida · '+fmtDate(task.dueDate), cls:'overdue'};
    if(task.dueDate===today) return {label:'Hoy', cls:task.status==='hecha' ? '' : 'today'};
    return {label:fmtDate(task.dueDate), cls:''};
  }

      return `<${tag} class="stage-step ${cls}" ${attrs}><span class="stage-emoji">${stage.emoji}</span><span class="stage-label">${stage.label}</span></${tag}>`;

      if(await runAction(save, isEdit?'Tarea actualizada':'Tarea agregada', 'No se pudo guardar la tarea.')) closeModal();
    });
  }

  function isoDate(date){
    return date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0');
  }

  // Las semanas van de lunes a domingo; la revisión se hace el domingo.
  function weekStartISO(date = new Date()){
    const start = new Date(date.getFullYear(), date.getMonth(), date.getDate());
    start.setDate(start.getDate() - ((start.getDay()+6)%7));
    return isoDate(start);
  }

  function currentReview(venture){
    const weekStart = weekStartISO();
    return state.reviews.find(review=>review.ventureId===venture.id && review.weekStart===weekStart);
  }

  function unsyncedGoogleTasks(venture){
    return state.tasks.filter(task=>task.ventureId===venture.id && task.dueDate && task.status!=='hecha' && !task.googleEventId);
  }

  function signedMoney(n){
    return n<0 ? '−'+fmtMoney(-n) : fmtMoney(n);
  }

  function lastMonthKeys(count){
    const now = new Date();
    return Array.from({length:count}, (_,index)=>{
      const date = new Date(now.getFullYear(), now.getMonth()-(count-1-index), 1);
      return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}`;
    });
  }

  function ventureFinance(venture){
    const txs = state.transactions.filter(tx=>tx.ventureId===venture.id)
      .sort((a,b)=>b.date.localeCompare(a.date) || (b.createdAt||'').localeCompare(a.createdAt||''));
    const sum = (list,kind)=>list.filter(tx=>tx.kind===kind).reduce((s,tx)=>s+tx.amount,0);
    const inMonth = key=>txs.filter(tx=>tx.date.slice(0,7)===key);
    const monthTxs = inMonth(todayISO().slice(0,7));
    const income = sum(txs,'ingreso'), expenses = sum(txs,'gasto'), profit = income-expenses;
    const investment = ventureBudget(venture).total;
    const months = lastMonthKeys(6).map(key=>({key, income:sum(inMonth(key),'ingreso'), expenses:sum(inMonth(key),'gasto')}));

    // Punto de equilibrio: ganancia promedio de los últimos 3 meses (o desde el primer movimiento, si es más reciente).
    let breakEven = null;
    if(investment>0){
      if(profit>=investment) breakEven = {done:true};
      else if(txs.length){
        const firstKey = txs[txs.length-1].date.slice(0,7);
        const recent = lastMonthKeys(3).filter(key=>key>=firstKey);
        const avg = recent.length ? recent.reduce((s,key)=>s+sum(inMonth(key),'ingreso')-sum(inMonth(key),'gasto'),0)/recent.length : 0;
        if(avg>0){
          const monthsLeft = Math.ceil((investment-profit)/avg);
          const target = new Date(); target.setDate(1); target.setMonth(target.getMonth()+monthsLeft);
          breakEven = {done:false, avg, monthsLeft, label:`${MONTHS[target.getMonth()]} ${target.getFullYear()}`};
        }
      }
    }
    return {
      txs, income, expenses, profit, investment, months, breakEven,
      month:{income:sum(monthTxs,'ingreso'), expenses:sum(monthTxs,'gasto')},
      recoveredPct: investment>0 ? Math.max(0, Math.min(100, Math.round((profit/investment)*100))) : 0
    };
  }

  function niceCeil(value){
    const power = 10 ** Math.floor(Math.log10(value));
    const n = value/power;
    return (n<=1 ? 1 : n<=2 ? 2 : n<=5 ? 5 : 10) * power;
  }

  function fmtCompact(value){
    return value>=1000 ? '$'+(value/1000).toLocaleString('es-MX',{maximumFractionDigits:1})+'k' : fmtMoney(value);
  }

  function financeChart(months){
    const max = Math.max(...months.flatMap(month=>[month.income, month.expenses]));
    if(max<=0) return '<div class="muted-empty">No hay movimientos en los últimos 6 meses.</div>';
    const top = niceCeil(max);
    return `
      <div class="fin-chart" role="img" aria-label="Ingresos y gastos de los últimos 6 meses">
        <div class="fin-legend"><span><i class="fin-swatch income"></i>Ingresos</span><span><i class="fin-swatch expense"></i>Gastos</span></div>
        <div class="fin-plot">
          <div class="fin-grid">${[top, top/2, 0].map(tick=>`<div class="fin-gridline"><span>${fmtCompact(tick)}</span></div>`).join('')}</div>
          <div class="fin-columns">${months.map(month=>{
            const [year, monthNumber] = month.key.split('-').map(Number);
            return `<div class="fin-month" tabindex="0" data-label="${MONTHS[monthNumber-1]} ${year}" data-income="${fmtMoney(month.income)}" data-expenses="${fmtMoney(month.expenses)}" data-profit="${signedMoney(month.income-month.expenses)}">
              <div class="fin-bars"><i class="fin-bar income" style="height:${(month.income/top)*100}%"></i><i class="fin-bar expense" style="height:${(month.expenses/top)*100}%"></i></div>
              <span class="fin-month-label">${MONTHS[monthNumber-1].slice(0,3)}</span>
            </div>`;
          }).join('')}</div>
        </div>
        <div class="fin-tooltip" hidden></div>
      </div>
    `;
  }

  function recoveryCard(finance){
    if(!finance.investment){
      return `<div class="prediction-card"><h3 class="agenda-title">Recuperación de la inversión</h3><p class="prediction-sub">Agreguen partidas al presupuesto de arranque para calcular cuándo recuperan lo invertido.</p></div>`;
    }
    const breakEven = finance.breakEven;
    const text = breakEven?.done ? '🎉 ¡Ya recuperaron todo lo invertido!'
      : breakEven?.monthsLeft ? `A este ritmo (${fmtMoney(breakEven.avg)} de ganancia al mes) la recuperan hacia <b>${breakEven.label}</b>.`
      : 'Cuando tengan ganancia mensual les diremos cuándo recuperan la inversión.';
    return `
      <div class="prediction-card">
        <h3 class="agenda-title">Recuperación de la inversión</h3>
        <div class="prediction-main">${finance.recoveredPct}%</div>

        <div class="prediction-sub">${text}</div>
        <div style="margin-top:12px;">

          <div class="quote-row"><span>Falta por recuperar</span><b>${fmtMoney(Math.max(0, finance.investment-finance.profit))}</b></div>
        </div>
      </div>
    `;
  }

    const remaining = state.tasks.filter(item=>item.ventureId===task.ventureId && item.id!==task.id && item.status!=='hecha').length;
    const venture = state.ventures.find(item=>item.id===task.ventureId);

  function handleVentureAction(action, id, btn){
    const idea = state.ideas.find(item=>item.id===id);
    const venture = state.ventures.find(item=>item.id===id);
    const budgetItem = state.budgetItems.find(item=>item.id===id);
    const task = state.tasks.find(item=>item.id===id);
    const transaction = state.transactions.find(item=>item.id===id);
    if(action==='new-idea') openIdeaForm(null);
    else if(action==='edit-idea' && idea) openIdeaForm(idea);
    else if(action==='vote-idea' && idea) openIdeaVote(idea);
    else if(action==='idea-to-venture' && idea) openVentureForm(null, idea);
    else if(action==='discard-idea' && idea){
      runAction(()=>setIdeaStatus(id,'descartada'), 'Idea descartada', 'No se pudo descartar la idea.').then(ok=>ok && closeModal());
    }
    else if(action==='restore-idea') runAction(()=>setIdeaStatus(id,'activa'), 'Idea recuperada', 'No se pudo recuperar la idea.');
    else if(action==='delete-idea'){
      if(confirm('¿Eliminar esta idea y sus votos?')) runAction(()=>removeIdea(id), 'Idea eliminada', 'No se pudo eliminar la idea.');
    }
    else if(action==='open-venture' || action==='open-task-venture') goToVenture(id);
    else if(action==='close-venture'){ activeVentureId = null; render(); }
    else if(action==='edit-venture' && venture) openVentureForm(venture, null);
    else if(action==='delete-venture' && venture){
      if(!confirm('¿Eliminar este proyecto y su presupuesto? La idea vuelve al banco y el plan de ahorro vinculado se conserva.')) return true;
      runAction(async()=>{ await deleteTaskGoogleEvents(state.tasks.filter(item=>item.ventureId===venture.id)); await removeVenture(venture); activeVentureId = null; }, 'Proyecto eliminado', 'No se pudo eliminar el proyecto.').then(ok=>ok && closeModal());
    }
    else if(action==='set-stage' && venture && venture.stage!==btn.dataset.stage){
      const stage = VENTURE_STAGES.find(item=>item.key===btn.dataset.stage);
      const advanced = VENTURE_STAGES.indexOf(stage) > VENTURE_STAGES.findIndex(item=>item.key===venture.stage);
      runAction(()=>updateVenture(id,{stage:stage.key}), advanced ? `🎉 ¡Llegaron a: ${stage.label}!` : `Etapa: ${stage.label}`, 'No se pudo cambiar la etapa.');
    }
    else if(action==='new-budget-item') openBudgetItemForm(id, null);
    else if(action==='edit-budget-item' && budgetItem) openBudgetItemForm(budgetItem.ventureId, budgetItem);
    else if(action==='toggle-paid' && budgetItem) runAction(()=>setBudgetItemPaid(id,!budgetItem.paid), null, 'No se pudo actualizar la partida.');
    else if(action==='delete-budget-item'){
      if(confirm('¿Eliminar esta partida?')) runAction(()=>removeBudgetItem(id), 'Partida eliminada', 'No se pudo eliminar la partida.').then(ok=>ok && closeModal());
    }
    else if(action==='new-task') openTaskForm(id, null);
    else if(action==='edit-task' && task) openTaskForm(task.ventureId, task);
    else if(action==='move-task' && task){
      const status = btn.dataset.status;
      const move = async()=>{ await moveTask(id,status); if(isMyGoogleTask(task)) await applyGoogleSync({...task, status}, true); };
      runAction(move, moveTaskMessage(task,status), 'No se pudo mover la tarea.');
    }
    else if(action==='delete-task' && task){
      if(confirm('¿Eliminar esta tarea?')) runAction(async()=>{ await deleteTaskGoogleEvents([task]); await removeTask(id); }, 'Tarea eliminada', 'No se pudo eliminar la tarea.').then(ok=>ok && closeModal());
    }
    else if(action==='sync-tasks-google' && venture){
      const pending = unsyncedGoogleTasks(venture);
      const sync = async()=>{ for(const item of pending){ await applyGoogleSync(item, true); if(googleWarning) break; } };
      runAction(sync, `📆 ${pending.length} tarea${pending.length===1?'':'s'} en Google Calendar`, 'No se pudo sincronizar con Google Calendar.');
    }
    else if(action==='new-transaction') openTransactionForm(id, null, btn.dataset.kind);
    else if(action==='edit-transaction' && transaction) openTransactionForm(transaction.ventureId, transaction);
    else if(action==='delete-transaction'){
      if(confirm('¿Eliminar este movimiento?')) runAction(()=>removeTransaction(id), 'Movimiento eliminado', 'No se pudo eliminar el movimiento.').then(ok=>ok && closeModal());
    }
    else if(action==='weekly-review' && venture) openReviewForm(venture);
    else if(action==='new-capital-plan' && venture) openCapitalPlanForm(venture);
    else if(action==='sync-capital-plan' && venture && venture.planId){
      runAction(()=>updatePlanTarget(venture.planId, ventureBudget(venture).total), 'Meta actualizada', 'No se pudo actualizar la meta.');
    }
    else return false;
    return true;
  }

    else if(action==='google-calendar-sync') connectGoogleCalendar();
    else if(action==='add-activity') openActivityForm(btn.dataset.date);
    else if(action==='daily-log') openDailyTracking(btn.dataset.date);
    else if(action==='period-end'){
      const cycle=state.menstrual.cycles.find(item=>item.id===id);
      if(cycle) openPeriodEndForm(cycle);
    }
    else if(action==='clear-period-end'){
      setPeriodEnd(id,null).then(async()=>{ await loadData(); showToast('Fecha de fin quitada'); closeModal(); render(); }).catch(()=>showToast('No se pudo quitar la fecha.'));
    }
    else if(action==='delete-daily-log'){
      if(confirm('¿Eliminar este registro diario?')) removeDailyLog(id).then(()=>{ showToast('Registro eliminado'); closeModal(); render(); }).catch(()=>showToast('No se pudo eliminar el registro.'));
    }
    else if(action==='delete-activity') removeActivity(id).then(async()=>{ await loadData(); openActivityForm(activeActivityDate); }).catch(()=>showToast('No se pudo eliminar la actividad.'));
    else if(action==='edit-contribution'){
      const plan = state.plans.find(item=>item.contributions.some(contribution=>contribution.id===id));
      if(plan) openEditContribution(plan.id,id);
    }
    else if(action==='delete-contribution'){
      const plan = state.plans.find(item=>item.contributions.some(contribution=>contribution.id===id));
      if(plan) deleteContribution(plan.id,id);
    }
    else if(action==='sign-out') supabase.auth.signOut();
    else if(action==='close-modal') closeModal();
  });

  document.getElementById('overlay').addEventListener('click', (e)=>{
    if(e.target.id==='overlay') closeModal();
  });
  document.addEventListener('keydown', (e)=>{
    if(e.key==='Escape') closeModal();
  });

  /* ---------------- INIT ---------------- */
  async function init(){
    try{
      const configResponse = await fetch('/api/config');
      const config = await configResponse.json();
      if(!configResponse.ok) throw new Error(config.error || 'Configuración ausente');
      googleClientId = config.googleClientId || '';
      if(!config.url || !config.anonKey) throw new Error('Configuración ausente');
      supabase = window.supabase.createClient(config.url, config.anonKey);
      // Supabase recomienda no esperar otras llamadas de supabase dentro de este callback (puede bloquear la sesión),
      // por eso la carga se difiere con setTimeout.
      supabase.auth.onAuthStateChange((_event, session)=>{
        setTimeout(()=>handleSession(session), 0);
      });
      async function handleSession(session){
        const authenticated = !!session;
        if(!authenticated){
          currentUserId = null;
          document.querySelector('.app').style.display = 'none';
          document.getElementById('authScreen').style.display = 'flex';
          return;
        }
        currentUserEmail = session.user.email;
        currentUserId = session.user.id;
        try{
          await loadData();
          document.querySelector('.app').style.display = 'flex';
          document.getElementById('authScreen').style.display = 'none';
          subscribeToChanges();
          render();
        }catch(error){
          document.querySelector('.app').style.display = 'none';
          document.getElementById('authScreen').style.display = 'flex';
          console.error('Error al cargar datos de Supabase', error);
          document.getElementById('authError').textContent = /failed to fetch|network/i.test(String(error?.message || ''))
            ? 'No se pudo conectar con Supabase. Revisa que el proyecto esté activo (no pausado) y que SUPABASE_URL sea correcta.'
            : 'La sesión es válida, pero no se pudieron cargar los planes. Ejecuta el esquema SQL y revisa las políticas RLS.';
        }
      }
      const {data:{session}} = await supabase.auth.getSession();
      if(!session){
        document.querySelector('.app').style.display = 'none';
        document.getElementById('authScreen').style.display = 'flex';
      }
      document.getElementById('authForm').addEventListener('submit', async(e)=>{
        e.preventDefault();
        const errorElement = document.getElementById('authError');
        const submitButton = e.target.querySelector('button[type="submit"]');
        errorElement.textContent = '';
        submitButton.disabled = true;
        submitButton.textContent = 'Entrando...';
        try{
          const {error} = await supabase.auth.signInWithPassword({email:document.getElementById('authEmail').value.trim(),password:document.getElementById('authPassword').value});
          if(error) errorElement.textContent = authErrorMessage(error);
        }catch(error){
          errorElement.textContent = authErrorMessage(error);
        }finally{
          submitButton.disabled = false;
          submitButton.textContent = 'Entrar';
        }
      });
    }catch(error){
      console.error('Error al cargar la configuración', error);
      document.getElementById('authScreen').style.display = 'flex';
      document.getElementById('authError').textContent = location.hostname === 'localhost'
        ? 'No se pudo cargar la configuración de Supabase. Revisa que Vercel Dev esté ejecutándose en http://localhost:3000.'
        : 'No se pudo cargar la configuración de Supabase. Revisa SUPABASE_URL y SUPABASE_ANON_KEY en las variables de entorno de Vercel.';
    }
  }
  init();

})();
</script>
