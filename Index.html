<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rumbo — Planea y ahorra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F7F2;
    --surface:#FFFFFF;
    --surface-alt:#EEF1EA;
    --ink:#182420;
    --ink-soft:#5B6860;
    --ink-faint:#8A968E;
    --teal:#173F37;
    --teal-2:#1F5548;
    --teal-soft:#DCE7E1;
    --gold:#C0923F;
    --gold-soft:#F3E7CB;
    --coral:#BD6248;
    --coral-soft:#F4E1D8;
    --sage:#7FA189;
    --border:#DFE4DA;
    --radius-sm:10px;
    --radius-md:16px;
    --radius-lg:26px;
    --shadow-sm:0 2px 8px -4px rgba(23,36,32,0.15);
    --shadow-md:0 12px 32px -16px rgba(23,36,32,0.28);
    --font-display:'Fraunces', serif;
    --font-body:'Manrope', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    background-image:
      radial-gradient(circle at 100% 0%, rgba(192,146,63,0.07), transparent 45%),
      radial-gradient(circle at 0% 100%, rgba(23,63,55,0.06), transparent 40%);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--gold-soft);}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  a{color:inherit;}

  .app{display:flex;min-height:100vh;}

  /* SIDEBAR */
  .sidebar{
    width:236px;flex-shrink:0;
    background:var(--teal);
    color:#EFEFE8;
    padding:28px 20px;
    display:flex;flex-direction:column;
    position:sticky;top:0;height:100vh;
  }
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .brand-mark{
    width:34px;height:34px;border-radius:9px;
    background:linear-gradient(155deg,var(--gold) 0%, #a97c30 100%);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);font-weight:700;font-size:17px;color:var(--teal);
    flex-shrink:0;
  }
  .brand-name{font-family:var(--font-display);font-size:21px;font-weight:600;letter-spacing:0.2px;}
  .brand-tag{font-size:11.5px;color:#B7C6BE;margin:0 0 30px 44px;letter-spacing:.2px;}
  .nav{display:flex;flex-direction:column;gap:3px;margin-top:6px;}
  .nav-item{
    display:flex;align-items:center;gap:11px;
    padding:10px 12px;border-radius:11px;
    color:#CBD8CF;background:transparent;border:none;
    font-size:14.5px;font-weight:600;text-align:left;
    transition:background .15s ease, color .15s ease;
  }
  .nav-item svg{width:18px;height:18px;flex-shrink:0;opacity:.85;}
  .nav-item:hover{background:rgba(255,255,255,0.07);color:#fff;}
  .nav-item.active{background:rgba(255,255,255,0.13);color:#fff;}
  .nav-item.active svg{opacity:1;}
  .sidebar-foot{margin-top:auto;padding-top:20px;border-top:1px solid rgba(255,255,255,0.12);}
  .sidebar-stat{font-family:var(--font-mono);font-size:12px;color:#9FB2A7;line-height:1.7;}
  .sidebar-stat b{color:#F1D8A0;font-weight:600;}

  /* MAIN */
  .main{flex:1;min-width:0;padding:36px 44px 60px;}
  .session-bar{display:flex;justify-content:flex-end;align-items:center;gap:12px;margin-bottom:18px;}
  .topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:30px;flex-wrap:wrap;}
  .page-title{font-family:var(--font-display);font-size:32px;font-weight:600;margin:0 0 4px;}
  .page-sub{color:var(--ink-soft);font-size:14.5px;margin:0;max-width:520px;}
  .btn{
    display:inline-flex;align-items:center;gap:8px;
    border:none;border-radius:12px;padding:11px 18px;
    font-size:14px;font-weight:700;letter-spacing:.1px;
    transition:transform .12s ease, box-shadow .12s ease, background .15s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--teal);color:#fff;box-shadow:var(--shadow-sm);}
  .btn-primary:hover{background:var(--teal-2);}
  .btn-gold{background:var(--gold);color:#2B2007;}
  .btn-gold:hover{background:#CBA254;}
  .btn-ghost{background:var(--surface);color:var(--ink);border:1px solid var(--border);}
  .btn-ghost:hover{background:var(--surface-alt);}
  .btn-sm{padding:8px 13px;font-size:13px;border-radius:10px;}
  .btn-icon{width:34px;height:34px;padding:0;justify-content:center;border-radius:10px;background:var(--surface);border:1px solid var(--border);color:var(--ink-soft);}
  .btn-icon:hover{background:var(--surface-alt);color:var(--ink);}
  .btn svg{width:15px;height:15px;}

  /* DASHBOARD HERO STATS */
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:32px;}
  .stat-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);
    padding:20px 20px 18px;position:relative;overflow:hidden;
  }
  .stat-card.accent{background:var(--teal);color:#fff;border:none;}
  .stat-label{font-size:12px;text-transform:uppercase;letter-spacing:.7px;font-weight:700;color:var(--ink-faint);}
  .stat-card.accent .stat-label{color:#AFC3B6;}
  .stat-value{font-family:var(--font-mono);font-size:26px;font-weight:600;margin-top:8px;letter-spacing:-0.5px;}
  .stat-foot{font-size:12.5px;color:var(--ink-faint);margin-top:6px;}
  .stat-card.accent .stat-foot{color:#C7D6CC;}

  .section-head{display:flex;align-items:baseline;justify-content:space-between;margin:38px 0 16px;}
  .section-title{font-family:var(--font-display);font-size:19px;font-weight:600;margin:0;}
  .section-link{font-size:13px;font-weight:700;color:var(--teal-2);background:none;border:none;}

  /* PLAN CARDS */
  .plan-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:18px;}
  .plan-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
    padding:22px;display:flex;flex-direction:column;gap:14px;
    box-shadow:var(--shadow-sm); position:relative;
    transition:box-shadow .18s ease, transform .18s ease;
  }
  .plan-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);}
  .plan-card-top{display:flex;align-items:flex-start;justify-content:space-between;}
  .plan-icon{
    width:42px;height:42px;border-radius:12px;background:var(--surface-alt);
    display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;
  }
  .plan-menu-btn{background:none;border:none;color:var(--ink-faint);width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;}
  .plan-menu-btn:hover{background:var(--surface-alt);color:var(--ink);}
  .plan-body{display:flex;gap:16px;align-items:center;}
  .ring{
    --pct:0;
    width:74px;height:74px;border-radius:50%;flex-shrink:0;
    background:conic-gradient(var(--ring-color,var(--teal-2)) calc(var(--pct)*1%), var(--surface-alt) 0);
    display:flex;align-items:center;justify-content:center;
  }
  .ring-inner{
    width:56px;height:56px;border-radius:50%;background:var(--surface);
    display:flex;align-items:center;justify-content:center;flex-direction:column;
  }
  .ring-pct{font-family:var(--font-mono);font-weight:600;font-size:14px;}
  .plan-name{font-family:var(--font-display);font-size:17.5px;font-weight:600;margin:0 0 3px;line-height:1.25;}
  .plan-cat{font-size:11.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.5px;font-weight:700;}
  .plan-amounts{font-family:var(--font-mono);font-size:13px;color:var(--ink-soft);margin-top:6px;}
  .plan-amounts b{color:var(--ink);font-weight:600;}
  .status-pill{
    display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;
    padding:4px 10px;border-radius:99px;width:fit-content;
  }
  .status-pill.ok{background:var(--teal-soft);color:var(--teal-2);}
  .status-pill.warn{background:var(--coral-soft);color:var(--coral);}
  .status-pill.done{background:var(--gold-soft);color:#8A6B27;}
  .plan-foot{display:flex;align-items:center;justify-content:space-between;border-top:1px dashed var(--border);padding-top:13px;margin-top:2px;}
  .plan-foot-date{font-size:12.5px;color:var(--ink-soft);}
  .plan-foot-date b{color:var(--ink);}
  .plan-actions{display:flex;gap:8px;}

  .empty-state{
    border:1.5px dashed var(--border);border-radius:var(--radius-lg);
    padding:52px 30px;text-align:center;color:var(--ink-soft);background:var(--surface);
  }
  .empty-state h3{font-family:var(--font-display);font-size:20px;color:var(--ink);margin:14px 0 6px;}
  .empty-emoji{font-size:34px;}

  /* CALENDAR */
  .cal-wrap{display:grid;grid-template-columns:1.55fr 1fr;gap:24px;align-items:start;}
  .cal-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;box-shadow:var(--shadow-sm);}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
  .cal-month{font-family:var(--font-display);font-size:20px;font-weight:600;text-transform:capitalize;}
  .cal-nav{display:flex;gap:6px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:78px;gap:6px;}
  .cal-dow{text-align:center;font-size:11px;font-weight:700;color:var(--ink-faint);padding-bottom:6px;text-transform:uppercase;}
  .cal-day{
    height:78px;min-height:78px;border-radius:11px;padding:7px 8px;background:var(--surface-alt);
    display:flex;flex-direction:column;justify-content:space-between;font-size:12.5px;color:var(--ink-soft);
    position:relative;cursor:pointer;transition:background .15s ease,box-shadow .15s ease;
  }
  .cal-day:not(.empty):hover{background:var(--teal-soft);box-shadow:inset 0 0 0 1px var(--teal-2);}
  .cal-day.empty{background:transparent;}
  .cal-day.today{outline:2px solid var(--teal-2);outline-offset:-2px;}
  .cal-day-num{font-family:var(--font-mono);font-weight:600;}
  .cal-dots{display:flex;gap:3px;flex-wrap:wrap;}
  .cal-dot{width:7px;height:7px;border-radius:50%;background:var(--gold);}
  .cal-day .cal-emojis{font-size:13px;line-height:1;}
  .cal-activities{display:flex;flex-direction:column;gap:3px;overflow:hidden;margin-top:3px;max-height:48px;}
  .cal-activity{display:flex;align-items:center;gap:4px;min-width:0;font-size:10px;line-height:1.2;color:var(--ink);font-weight:700;}
  .cal-activity-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;background:var(--activity-color,var(--gold));}
  .cal-activity-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cal-activity-more{font-size:9px;color:var(--ink-faint);font-family:var(--font-mono);}

  .side-list{display:flex;flex-direction:column;gap:12px;}
  .agenda-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow-sm);}
  .agenda-title{font-family:var(--font-display);font-size:16.5px;font-weight:600;margin:0 0 12px;}
  .agenda-item{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--border);}
  .agenda-item:last-child{border-bottom:none;}
  .agenda-emoji{width:34px;height:34px;border-radius:9px;background:var(--surface-alt);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
  .agenda-name{font-size:13.5px;font-weight:700;}
  .agenda-sub{font-size:11.5px;color:var(--ink-faint);font-family:var(--font-mono);}
  .agenda-check{margin-left:auto;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;}
  .agenda-check.pending{background:var(--coral-soft);color:var(--coral);}
  .agenda-check.done{background:var(--teal-soft);color:var(--teal-2);}
  .muted-empty{font-size:13px;color:var(--ink-faint);padding:8px 0;}

  /* MODAL */
  .overlay{
    position:fixed;inset:0;background:rgba(15,22,19,0.5);backdrop-filter:blur(2px);
    display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;
    opacity:0;pointer-events:none;transition:opacity .18s ease;
  }
  .overlay.show{opacity:1;pointer-events:auto;}
  .modal{
    background:var(--surface);border-radius:var(--radius-lg);width:100%;max-width:480px;
    max-height:88vh;overflow-y:auto;padding:28px;box-shadow:0 30px 60px -20px rgba(0,0,0,0.35);
    transform:translateY(8px);transition:transform .18s ease;
  }
  .overlay.show .modal{transform:translateY(0);}
  .modal-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;}
  .modal-title{font-family:var(--font-display);font-size:22px;font-weight:600;margin:0;}
  .modal-close{background:var(--surface-alt);border:none;width:30px;height:30px;border-radius:9px;color:var(--ink-soft);flex-shrink:0;}
  .modal-close:hover{background:var(--border);}
  .field{margin-bottom:15px;}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:6px;}
  .field input, .field select, .field textarea{
    width:100%;border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;
    font-size:14px;color:var(--ink);background:var(--bg);outline:none;transition:border-color .15s ease;
  }
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--teal-2);}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;}

  /* DETAIL MODAL QUOTE BOX */
  .quote-box{background:var(--teal);color:#fff;border-radius:var(--radius-md);padding:19px 20px;margin:16px 0;}
  .quote-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:13.5px;border-bottom:1px solid rgba(255,255,255,0.12);}
  .quote-row:last-child{border-bottom:none;}
  .quote-row span:first-child{color:#B7C6BE;}
  .quote-row b{font-family:var(--font-mono);font-weight:600;font-size:14.5px;}
  .quote-highlight{background:rgba(192,146,63,0.22);border-radius:10px;padding:12px 14px;margin-top:8px;}
  .quote-highlight .quote-row{border:none;padding:3px 0;}
  .quote-highlight span:first-child{color:#F1D8A0;}
  .quote-highlight b{color:#fff;}

  .contrib-list{display:flex;flex-direction:column;gap:8px;margin-top:6px;max-height:160px;overflow-y:auto;}
  .contrib-item{display:flex;align-items:center;gap:8px;font-size:13px;padding:8px 11px;background:var(--surface-alt);border-radius:9px;}
  .contrib-item b{font-family:var(--font-mono);color:var(--teal-2);}
  .contrib-item-main{display:flex;justify-content:space-between;align-items:center;gap:10px;min-width:0;flex:1;}
  .contrib-item-main span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .contrib-actions{display:flex;gap:4px;flex-shrink:0;}
  .contrib-action{border:0;background:transparent;color:var(--ink-faint);font-size:12px;padding:4px 6px;border-radius:6px;}
  .contrib-action:hover{background:var(--surface);color:var(--ink);}
  .contrib-action.delete:hover{background:var(--coral-soft);color:var(--coral);}

  .toast{
    position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-size:13.5px;font-weight:600;
    box-shadow:var(--shadow-md);opacity:0;pointer-events:none;transition:all .22s ease;z-index:80;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .mobile-nav{display:none;}

  .auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg);}
  .auth-panel{width:min(420px,100%);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:32px;box-shadow:var(--shadow-md);}
  .auth-panel .brand{color:var(--teal);margin-bottom:10px;}
  .auth-panel h1{font-family:var(--font-display);font-size:28px;margin:24px 0 6px;}
  .auth-panel p{color:var(--ink-soft);font-size:14px;line-height:1.5;margin:0 0 22px;}
  .auth-error{color:var(--coral);font-size:13px;min-height:20px;margin-top:10px;}
  .user-menu{display:flex;align-items:center;gap:10px;color:var(--ink-soft);font-size:12px;}
  .user-email{max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .menstrual-layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,1fr);gap:22px;align-items:start;}
  .cycle-calendar{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;box-shadow:var(--shadow-sm);}
  .cycle-legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px;color:var(--ink-soft);font-size:11.5px;}
  .cycle-legend span{display:inline-flex;align-items:center;gap:5px;}
  .legend-dot{width:9px;height:9px;border-radius:50%;background:var(--coral);}
  .legend-ring{width:11px;height:11px;border:2px solid var(--coral);border-radius:50%;}
  .legend-blue{width:10px;height:10px;border-radius:50%;background:#5486a6;}
  .legend-sex{font-size:12px;line-height:1;}
  .cycle-grid .cal-day{height:86px;min-height:86px;justify-content:flex-start;gap:4px;}
  .cycle-grid{grid-auto-rows:86px;}
  .cycle-day-number{display:flex;align-items:center;justify-content:space-between;font-family:var(--font-mono);font-weight:600;}
  .cycle-day-number .flow-mark{width:8px;height:8px;border-radius:50%;background:var(--coral);}
  .sex-mark{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:999px;background:rgba(84,134,166,.16);font-size:10px;line-height:1;}
  .sex-mark.unprotected{background:rgba(189,98,72,.16);}
  .cycle-day.period{background:#fbe9e3;}
  .cycle-day.period-end{box-shadow:inset -3px 0 0 var(--coral);}
  .legend-period{width:11px;height:11px;border-radius:3px;background:#fbe9e3;border:1px solid #efc9bc;}
  .period-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;padding:11px 12px;border-radius:10px;background:rgba(255,255,255,.1);font-size:12.5px;color:#dfe8e2;line-height:1.4;}
  .period-row b{color:#fff;}
  .btn-on-dark{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.22);flex-shrink:0;}
  .btn-on-dark:hover{background:rgba(255,255,255,.22);}
  .cycle-history .agenda-item{gap:10px;}
  .cycle-history .agenda-sub{font-family:var(--font-body);}
  .cycle-day.predicted-range{outline:2px dashed #e3a693;outline-offset:-3px;}
  .legend-range{width:11px;height:11px;border:2px dashed #e3a693;border-radius:3px;}
  .signal-mark{font-size:10px;line-height:1;}
  .cycle-day-label.confirmed{color:#2f6f8f;}
  .signal-hint{font-weight:500;color:var(--ink-faint);font-size:11.5px;}
  .signals-title{font-family:var(--font-display);font-size:15px;font-weight:600;margin:6px 0 4px;}
  .signals-note{font-size:11.5px;color:var(--ink-faint);margin:0 0 12px;line-height:1.4;}
  .estimate-tag{font-size:10px;font-weight:700;color:var(--ink-faint);}
  .cycle-day.predicted{box-shadow:inset 0 0 0 2px var(--coral);background:#fff9f6;}
  .cycle-day.fertile{background:#eaf3f7;}
  .cycle-day.ovulation{background:#d8e9f1;box-shadow:inset 0 0 0 2px #5486a6;}
  .cycle-day.today .cycle-day-number{color:var(--teal-2);}
  button.cycle-day{font-family:inherit;text-align:left;border:0;width:100%;}
  .cycle-day-label{font-size:9.5px;color:#5486a6;font-weight:800;text-transform:uppercase;letter-spacing:.2px;}
  .tracking-card,.prediction-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;box-shadow:var(--shadow-sm);}
  .prediction-card{background:var(--teal);color:#fff;border:0;}
  .prediction-card .agenda-title{color:#fff;}
  .prediction-main{font-family:var(--font-display);font-size:27px;line-height:1.1;margin:8px 0 5px;}
  .prediction-sub{color:#c7d6cc;font-size:13px;line-height:1.45;}
  .prediction-meta{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:18px;}
  .prediction-meta div{padding:10px;background:rgba(255,255,255,.1);border-radius:10px;}
  .prediction-meta small{display:block;color:#b7c6be;font-size:10px;text-transform:uppercase;letter-spacing:.5px;font-weight:700;}
  .prediction-meta b{display:block;margin-top:4px;font-family:var(--font-mono);font-size:12px;}

  .pregnancy-pill.high{background:rgba(189,98,72,.24);color:#ffd2c5;}
  .tracking-card{margin-top:16px;}
  .tracking-card .field{margin-bottom:12px;}
  .choice-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}

  .choice-grid input{position:absolute;opacity:0;pointer-events:none;}
  .choice-grid span{display:flex;align-items:center;justify-content:center;min-height:38px;padding:5px;border:1px solid var(--border);border-radius:9px;font-size:11px;color:var(--ink-soft);text-align:center;cursor:pointer;}

  .chip-grid{display:flex;flex-wrap:wrap;gap:6px;}
  .chip-grid label{position:relative;}
  .chip-grid input{position:absolute;opacity:0;pointer-events:none;}
  .chip-grid span{display:block;padding:7px 9px;border:1px solid var(--border);border-radius:99px;font-size:11px;color:var(--ink-soft);cursor:pointer;}

  .sex-toggle{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--surface-alt);border-radius:10px;margin-bottom:10px;}
  .sex-toggle label{font-size:12.5px;font-weight:700;color:var(--ink-soft);margin:0;}
  .cycle-note{font-size:12px;color:var(--ink-faint);line-height:1.45;margin:14px 0 0;}
  .activity-list{display:flex;flex-direction:column;gap:7px;margin:10px 0 18px;max-height:150px;overflow-y:auto;}
  .activity-item{display:flex;align-items:center;gap:9px;padding:9px 10px;background:var(--surface-alt);border-radius:9px;}
  .activity-item-dot{width:8px;height:8px;border-radius:50%;background:var(--activity-color,var(--gold));flex-shrink:0;}
  .activity-item-body{min-width:0;flex:1;}
  .activity-item-title{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .activity-item-meta{font-size:11px;color:var(--ink-faint);font-family:var(--font-mono);}
  .activity-reminder{display:inline-flex;align-items:center;gap:4px;margin-top:4px;padding:4px 7px;border-radius:999px;background:rgba(84,134,166,.12);color:var(--teal-2);font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;}
  .activity-delete{border:0;background:transparent;color:var(--ink-faint);font-size:16px;padding:3px 6px;border-radius:6px;}
  .activity-delete:hover{background:var(--coral-soft);color:var(--coral);}

  /* EMPRENDE */
  .section-hint{font-size:12.5px;color:var(--ink-faint);}
  .idea-rank{width:42px;height:42px;border-radius:12px;background:var(--gold-soft);color:#8A6B27;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-weight:600;font-size:15px;flex-shrink:0;}
  .idea-desc{font-size:13px;color:var(--ink-soft);line-height:1.45;margin:6px 0 0;}
  .idea-score{display:flex;align-items:baseline;gap:4px;}
  .idea-score-value{font-family:var(--font-mono);font-size:26px;font-weight:600;letter-spacing:-.5px;}
  .idea-score-max{font-family:var(--font-mono);font-size:13px;color:var(--ink-faint);}
  .criteria-bars{display:flex;flex-direction:column;gap:6px;}
  .criteria-row{display:grid;grid-template-columns:70px 1fr;align-items:center;gap:10px;font-size:11.5px;color:var(--ink-soft);font-weight:700;}
  .progress-track{height:6px;border-radius:99px;background:var(--surface-alt);overflow:hidden;}
  .progress-track i{display:block;height:100%;border-radius:inherit;background:var(--teal-2);}
  .prediction-card .progress-track{background:rgba(255,255,255,.14);margin:12px 0 6px;}
  .prediction-card .progress-track i{background:var(--gold);}
  .vote-status{display:flex;gap:6px;flex-wrap:wrap;}
  .rating-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
  .rating-grid label{position:relative;margin:0;}
  .rating-grid input{position:absolute;opacity:0;pointer-events:none;}
  .rating-grid span{display:flex;align-items:center;justify-content:center;height:40px;border:1px solid var(--border);border-radius:9px;font-family:var(--font-mono);font-weight:600;font-size:14px;color:var(--ink-soft);cursor:pointer;}
  .rating-grid input:checked+span{background:var(--teal-soft);border-color:var(--teal-2);color:var(--teal-2);}
  .rating-grid input:focus-visible+span{outline:2px solid var(--teal-2);outline-offset:2px;}
  .field-hint{font-weight:500;color:var(--ink-faint);}
  .modal-note{color:var(--ink-soft);font-size:13.5px;line-height:1.45;margin:-6px 0 16px;}
  .discard-list{display:flex;flex-direction:column;gap:8px;}
  .discard-item{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:12px;font-size:13.5px;color:var(--ink-soft);}
  .discard-item span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .stage-stepper{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
  .stage-step{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 6px;border-radius:12px;background:var(--surface-alt);border:1px solid transparent;color:var(--ink-faint);font-family:inherit;font-size:11.5px;font-weight:700;text-align:center;}
  button.stage-step:hover{border-color:var(--teal-2);}
  .stage-step.done{background:var(--teal-soft);color:var(--teal-2);}
  .stage-step.current{background:var(--teal);color:#fff;}
  .stage-emoji{font-size:18px;line-height:1;}
  .stage-stepper.compact .stage-step{padding:7px 4px;}
  .stage-stepper.compact .stage-label{display:none;}
  .back-link{background:none;border:none;color:var(--teal-2);font-size:13px;font-weight:700;padding:0;margin-bottom:8px;}
  .venture-layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,1fr);gap:22px;align-items:start;margin-top:22px;}
  .venture-col{display:flex;flex-direction:column;gap:16px;}
  .canvas-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .canvas-cell{background:var(--surface-alt);border-radius:12px;padding:12px 14px;}
  .canvas-cell small{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;font-weight:800;color:var(--ink-faint);margin-bottom:5px;}
  .canvas-cell p{margin:0;font-size:13.5px;line-height:1.45;white-space:pre-line;overflow-wrap:anywhere;}
  .canvas-cell p.empty{color:var(--ink-faint);font-style:italic;}
  .card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;}
  .card-head .agenda-title{margin:0;}
  .budget-item{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--border);}
  .budget-item:last-child{border-bottom:none;}
  .budget-item-body{flex:1;min-width:0;}
  .budget-item-body .agenda-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .budget-item-amount{font-family:var(--font-mono);font-weight:600;font-size:13.5px;white-space:nowrap;}
  .paid-toggle{border:1px solid var(--border);background:var(--surface);border-radius:99px;font-size:11px;font-weight:700;padding:4px 10px;color:var(--coral);white-space:nowrap;}
  .paid-toggle.done{background:var(--teal-soft);border-color:transparent;color:var(--teal-2);}
  .task-board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start;}
  .task-column{background:var(--surface-alt);border-radius:var(--radius-md);padding:12px;display:flex;flex-direction:column;gap:8px;min-height:120px;}
  .task-column-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-soft);padding:2px 4px 4px;}
  .task-count{font-family:var(--font-mono);background:var(--surface);border-radius:99px;padding:2px 8px;font-size:11px;}
  .task-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:11px 12px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow-sm);}
  .task-title{background:none;border:none;padding:0;text-align:left;font-size:13.5px;font-weight:700;color:var(--ink);line-height:1.35;overflow-wrap:anywhere;}
  .task-title:hover{color:var(--teal-2);}
  .task-card.hecha .task-title{text-decoration:line-through;color:var(--ink-faint);}
  .task-meta{display:flex;flex-wrap:wrap;gap:6px;}
  .task-tag{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:99px;background:var(--surface-alt);color:var(--ink-soft);font-size:11px;font-weight:700;white-space:nowrap;}
  .task-card .task-tag{background:var(--bg);}
  .task-tag.overdue{background:var(--coral-soft);color:var(--coral);}
  .task-tag.today{background:var(--gold-soft);color:#8A6B27;}
  .task-moves{display:flex;gap:6px;justify-content:flex-end;}
  .task-move{border:1px solid var(--border);background:var(--surface);border-radius:8px;font-size:11.5px;font-weight:700;padding:5px 9px;color:var(--ink-soft);}
  .task-move:hover{background:var(--surface-alt);color:var(--ink);}
  .task-move.primary{background:var(--teal);border-color:var(--teal);color:#fff;}
  .task-move.primary:hover{background:var(--teal-2);}
  .cal-activity.task .cal-activity-label{color:var(--teal-2);}
  .cal-activity.task.done .cal-activity-label{text-decoration:line-through;color:var(--ink-faint);}
  .modal-subtitle{font-family:var(--font-display);font-size:16px;font-weight:600;margin:0 0 8px;}
  .head-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;}
  .review-banner{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:16px;padding:16px 18px;border-radius:var(--radius-md);background:var(--gold-soft);border:1px solid #E8D3A2;}
  .review-banner.done{background:var(--teal-soft);border-color:transparent;}
  .review-kicker{font-size:11px;text-transform:uppercase;letter-spacing:.5px;font-weight:800;color:var(--ink-soft);}
  .review-priority{font-family:var(--font-display);font-size:17px;font-weight:600;margin-top:4px;overflow-wrap:anywhere;}
  .review-banner .btn{flex-shrink:0;}
  .week-stats{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 16px;}
  .review-history{margin-top:22px;border-top:1px solid var(--border);padding-top:14px;}
  .review-history-item{padding:10px 0;border-bottom:1px solid var(--border);font-size:13px;line-height:1.45;}
  .review-history-item:last-child{border-bottom:none;}
  .review-history-item b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-faint);margin-bottom:3px;}
  .review-history-item p{margin:2px 0;color:var(--ink-soft);white-space:pre-line;overflow-wrap:anywhere;}
  .fin-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:18px;}
  .fin-stat{background:var(--surface-alt);border-radius:12px;padding:12px 14px;}
  .fin-stat small{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;font-weight:800;color:var(--ink-faint);}
  .fin-stat b{display:block;font-family:var(--font-mono);font-size:17px;font-weight:600;margin-top:5px;}
  .fin-chart{position:relative;margin-bottom:8px;}
  .fin-legend{display:flex;gap:14px;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:12px;}
  .fin-legend span{display:inline-flex;align-items:center;gap:6px;}
  .fin-swatch{width:10px;height:10px;border-radius:3px;}
  .fin-swatch.income,.fin-bar.income{background:#139B7A;}
  .fin-swatch.expense,.fin-bar.expense{background:#C9772B;}
  .fin-plot{position:relative;padding-left:48px;}
  .fin-grid{position:absolute;left:0;right:0;top:0;height:140px;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none;}
  .fin-gridline{border-top:1px solid var(--border);position:relative;height:0;}
  .fin-gridline span{position:absolute;left:0;top:-8px;font-family:var(--font-mono);font-size:10.5px;color:var(--ink-faint);}
  .fin-columns{display:flex;position:relative;}
  .fin-month{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;outline:none;cursor:default;}
  .fin-bars{height:140px;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:2px;border-radius:8px 8px 0 0;transition:background .12s ease;}
  .fin-month:hover .fin-bars,.fin-month:focus-visible .fin-bars{background:rgba(23,63,55,.06);}
  .fin-bar{display:block;width:min(18px,30%);border-radius:4px 4px 0 0;}
  .fin-month-label{font-size:11px;color:var(--ink-faint);margin-top:6px;font-weight:700;text-transform:capitalize;}
  .fin-tooltip{position:absolute;z-index:5;transform:translate(-50%,-100%);background:var(--ink);color:#fff;border-radius:10px;padding:9px 11px;font-size:12px;line-height:1.55;white-space:nowrap;pointer-events:none;box-shadow:var(--shadow-md);}
  .fin-tooltip b{font-family:var(--font-mono);font-weight:600;}
  .fin-tooltip .fin-swatch{display:inline-block;margin-right:6px;}
  .fin-list{max-height:320px;overflow-y:auto;margin-top:6px;}

  @media (max-width:980px){
    .stat-grid{grid-template-columns:repeat(2,1fr);}
    .cal-wrap{grid-template-columns:1fr;}
    .menstrual-layout{grid-template-columns:1fr;}
    .venture-layout{grid-template-columns:1fr;}
  }
  @media (max-width:760px){
    .sidebar{position:fixed;bottom:0;left:0;right:0;top:auto;width:100%;height:auto;
      flex-direction:row;align-items:center;padding:10px 14px;z-index:40;}
    .brand,.brand-tag,.sidebar-foot{display:none;}
    .nav{flex-direction:row;justify-content:space-around;width:100%;}
    .nav-item{flex-direction:column;gap:3px;font-size:10.5px;padding:6px 8px;}
    .nav-item svg{width:19px;height:19px;}
    .main{padding:24px 16px 100px;}
    .stat-grid{grid-template-columns:1fr 1fr;}
    .page-title{font-size:26px;}
    .field-row{grid-template-columns:1fr;}
    .topbar{align-items:flex-start;margin-bottom:22px;}
    .topbar>.btn{width:100%;justify-content:center;}
    .cal-card,.cycle-calendar,.tracking-card,.prediction-card{padding:14px;border-radius:18px;}
    .cal-head{margin-bottom:12px;}
    .cal-month{font-size:18px;}
    .cal-grid{grid-auto-rows:60px;gap:4px;}
    .cal-day{height:60px;min-height:60px;padding:6px 5px;border-radius:8px;font-size:11px;}
    .cal-activities{max-height:32px;gap:2px;align-items:flex-start;}
    .cal-activity{font-size:0;gap:0;}
    .cal-activity-dot{width:6px;height:6px;}
    .cal-activity-label{display:none;}
    .cal-activity-more{font-size:8px;line-height:1.1;}
    .cal-day .cal-emojis{font-size:10px;}
    .cycle-grid{grid-auto-rows:64px;}
    .cycle-grid .cal-day{height:64px;min-height:64px;padding:6px 5px;}
    .cycle-day-label{font-size:7px;letter-spacing:0;}
    .cycle-legend{gap:7px;font-size:10px;}
    .prediction-main{font-size:24px;}
    .prediction-meta{gap:6px;margin-top:14px;}
    .prediction-meta div{padding:8px;}
    .prediction-meta b{font-size:10px;line-height:1.3;}
    .prediction-meta small{font-size:9px;}
    .choice-grid span{font-size:10px;min-height:42px;padding:4px 2px;}
    .modal{padding:20px;max-height:92vh;}
    .canvas-grid{grid-template-columns:1fr;}
    .stage-label{font-size:9.5px;}
    .budget-item{flex-wrap:wrap;row-gap:6px;}
    .budget-item-body{flex:1 1 calc(100% - 50px);}
    .budget-item-amount,.budget-item .task-tag{margin-left:45px;margin-right:auto;}
    .task-board{grid-template-columns:1fr;}
    .review-banner{flex-direction:column;align-items:stretch;}
    .section-head{flex-wrap:wrap;gap:10px;align-items:center;}
    .head-actions{justify-content:flex-start;}
    .review-banner .btn{justify-content:center;}
    .fin-stats{grid-template-columns:1fr 1fr;}
    .fin-stats .fin-stat:last-child{grid-column:1 / -1;}
    .fin-plot{padding-left:40px;}
    .task-column{min-height:0;}
  }
</style>
</head>

<div class="app">
  <aside class="sidebar">
    <div class="brand">

<script>
(function(){
  "use strict";

  /* ---------------- DATA LAYER ---------------- */
  let supabase = null;
  let realtimeChannel = null;
  let state = { plans: [], activities: [], menstrual: { preferences: null, cycles: [], dailyLogs: [] }, ideas: [], ideaVotes: [], ventures: [], budgetItems: [], tasks: [], transactions: [], reviews: [] };
  let currentView = 'dashboard';
  let calDate = new Date();
  let activeDetailId = null;
  let activeActivityDate = null;
  let activeVentureId = null;
  let currentUserEmail = '';
  let currentUserId = null;
  let googleClientId = '';

  const CATEGORIES = {
    viaje:     {label:'Viaje',       emoji:'✈️'},
    vivienda:  {label:'Vivienda',    emoji:'🏠'},
    vehiculo:  {label:'Vehículo',    emoji:'🚗'},
    educacion: {label:'Educación',   emoji:'🎓'},
    boda:      {label:'Boda',        emoji:'💍'},
    tecnologia:{label:'Tecnología',  emoji:'💻'},
    salud:     {label:'Salud',       emoji:'🩺'},
    negocio:   {label:'Negocio',     emoji:'🚀'},
    otro:      {label:'Otro',        emoji:'⭐'}
  };

  function uid(){ return 'p_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

  function fromRows(plans, contributions, activities, preferences, cycles, dailyLogs){
    const grouped = contributions.reduce((map, contribution)=>{
      (map[contribution.plan_id] ||= []).push({id:contribution.id, amount:Number(contribution.amount), date:contribution.date, note:contribution.note||''});
      return map;
    }, {});
    return {plans:plans.map(plan=>({
      id:plan.id, name:plan.name, category:plan.category, description:plan.description||'',
      targetCost:Number(plan.target_cost), targetDate:plan.target_date, initial:Number(plan.initial||0),
      createdAt:plan.created_at.slice(0,10), contributions:grouped[plan.id]||[]
    })), activities:(activities||[]).map(activity=>({
      id:activity.id, title:activity.title, date:activity.date, time:activity.time||'',
      note:activity.note||'', color:activity.color||'gold', reminderAt:activity.reminder_at || null, reminderSent:!!activity.reminder_sent
    })), menstrual:{
      preferences:preferences || {default_cycle_length:28,default_period_length:5},
      cycles:(cycles||[]).map(cycle=>({id:cycle.id,userId:cycle.user_id,startDate:cycle.start_date,endDate:cycle.end_date,cycleLength:cycle.cycle_length,periodEndDate:cycle.period_end_date||null})),
      dailyLogs:(dailyLogs||[]).map(log=>({
        id:log.id,
        userId:log.user_id,
        date:log.date,
        flowIntensity:log.flow_intensity,
        symptoms:log.symptoms||[],
        mood:log.mood||[],
        hadSex:!!log.had_sex,
        protectionUsed:log.protection_used===null?null:!!log.protection_used,
        lhTest:log.lh_test||'none',
        cervicalMucus:log.cervical_mucus||'none',
        bbt:log.bbt==null ? null : Number(log.bbt)
      }))
    }};
  }

  async function loadData(){
    const results = await Promise.all([
      supabase.from('plans').select('*').order('target_date'),
      supabase.from('contributions').select('*').order('date',{ascending:false}),
      supabase.from('activities').select('*').order('date').order('time'),
      supabase.from('user_preferences').select('*').eq('user_id',currentUserId).maybeSingle(),
      supabase.from('cycles').select('*').order('start_date',{ascending:false}),
      supabase.from('daily_logs').select('*').order('date',{ascending:false}),
      supabase.from('ideas').select('*').order('created_at',{ascending:false}),
      supabase.from('idea_votes').select('*'),
      supabase.from('ventures').select('*').order('created_at',{ascending:false}),
      supabase.from('venture_budget_items').select('*').order('created_at'),
      supabase.from('venture_tasks').select('*').order('created_at'),
      supabase.from('venture_transactions').select('*').order('date',{ascending:false}),
      supabase.from('venture_reviews').select('*').order('week_start',{ascending:false})
    ]);
    const failed = results.find(result=>result.error);
    if(failed) throw failed.error;
    const [plans,contributions,activities,preferences,cycles,dailyLogs,ideas,ideaVotes,ventures,budgetItems,tasks,transactions,reviews] = results.map(result=>result.data);
    state = {...fromRows(plans||[], contributions||[], activities||[], preferences, cycles, dailyLogs), ...ventureStateFromRows(ideas||[], ideaVotes||[], ventures||[], budgetItems||[], tasks||[], transactions||[], reviews||[])};
    scheduleActivityNotifications();
  }

    realtimeChannel = supabase.channel('rumbo-shared-data')
      .on('postgres_changes',{event:'*',schema:'public',table:'plans'},refreshFromRealtime)
      .on('postgres_changes',{event:'*',schema:'public',table:'contributions'},refreshFromRealtime)

  function authErrorMessage(error){
    const message = String(error?.message || '').toLowerCase();
    if(message.includes('email not confirmed')) return 'Confirma el correo del usuario en Supabase Auth antes de iniciar sesión.';
    if(message.includes('invalid login credentials')) return 'El correo o la contraseña no coinciden. El UID no se usa para iniciar sesión.';
    if(message.includes('failed to fetch') || message.includes('network')) return 'No se pudo conectar con Supabase. Revisa que el proyecto esté activo (no pausado).';
    if(message.includes('email rate limit')) return 'Supabase bloqueó temporalmente los intentos. Espera unos minutos y vuelve a probar.';
    return error?.message || 'No se pudo iniciar sesión.';
  }

  const activityReminderTimers = new Map();

  function localDateTimeForInput(date = new Date()){

    return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
  }

  function formatReminderText(value){

  async function ensureNotificationPermission(){
    if(!('Notification' in window)){
      showToast('Este navegador no soporta notificaciones web.');
      return false;
    }
    if(Notification.permission === 'granted') return true;
    if(Notification.permission === 'denied'){
      showToast('Las notificaciones están bloqueadas para este navegador.');
      return false;
    }
    const result = await Notification.requestPermission();
    if(result === 'granted') return true;
    showToast('Debes permitir notificaciones para recibir recordatorios.');
    return false;
  }

  function scheduleActivityNotifications(){
    activityReminderTimers.forEach((timer)=>clearTimeout(timer));
    activityReminderTimers.clear();
    const now = Date.now();
    state.activities.forEach((activity)=>{
      if(!activity.reminderAt || activity.reminderSent) return;
      const reminderTime = new Date(activity.reminderAt).getTime();
      if(Number.isNaN(reminderTime) || reminderTime <= now) return;
      const delay = reminderTime - now;
      const timer = setTimeout(async()=>{
        const hasPermission = 'Notification' in window && Notification.permission === 'granted';
        if(hasPermission){
          new Notification('Recordatorio de actividad', {
            body: `${activity.title}${activity.note ? ' · ' + activity.note : ''}`,
            tag: `activity-${activity.id}`
          });
        }
        const {error} = await supabase.from('activities').update({reminder_sent: true}).eq('id', activity.id);
        if(!error){
          const match = state.activities.find(item=>item.id===activity.id);
          if(match) match.reminderSent = true;
        }
      }, delay);
      activityReminderTimers.set(activity.id, timer);
    });
  }

  function connectGoogleCalendar(){
    const clientId = googleClientId;
    if(!clientId){
      showToast('Falta GOOGLE_CLIENT_ID en Vercel para Google Calendar.');
      return;
    }
    if(!window.google || !window.google.accounts || !window.google.accounts.oauth2){
      showToast('Google OAuth no está disponible en esta página.');
      return;
    }
    const tokenClient = window.google.accounts.oauth2.initTokenClient({
      client_id: clientId,
      scope: 'https://www.googleapis.com/auth/calendar.events',
      callback: (tokenResponse) => {
        if(tokenResponse.error){
          showToast('No se pudo autorizar Google Calendar.');
          return;
        }
        localStorage.setItem('googleCalendarAccessToken', tokenResponse.access_token);
        localStorage.setItem('googleCalendarTokenExpiry', String(Date.now() + (tokenResponse.expires_in || 3600) * 1000));
        showToast('Google Calendar conectado');
        render();
      }
    });
    tokenClient.requestAccessToken({ prompt: 'consent' });
  }

  function normalizeGoogleTime(value){
    if(!value) return '09:00';
    const cleaned = String(value).trim();

    const simpleMatch = /^\s*(\d{1,2}):(\d{2})(?::\d{2})?\s*$/.exec(cleaned);
    if(simpleMatch){
      const hours = Number(simpleMatch[1]);
      const minutes = Number(simpleMatch[2]);
      if(hours >= 0 && hours <= 23 && minutes >= 0 && minutes <= 59){
        return `${String(hours).padStart(2,'0')}:${String(minutes).padStart(2,'0')}`;
      }
    }

    const isoMatch = /^\s*(\d{4})-(\d{2})-(\d{2})[T\s](\d{1,2}):(\d{2})/.exec(cleaned);
    if(isoMatch){
      const hours = Number(isoMatch[4]);
      const minutes = Number(isoMatch[5]);
      if(hours >= 0 && hours <= 23 && minutes >= 0 && minutes <= 59){
        return `${String(hours).padStart(2,'0')}:${String(minutes).padStart(2,'0')}`;
      }
    }

    return '09:00';
  }

  function buildGoogleDateTime(dateValue, timeValue){
    const dateText = String(dateValue || '').slice(0,10);
    let baseDate = new Date();
    if(/^\d{4}-\d{2}-\d{2}$/.test(dateText)){
      const [year, month, day] = dateText.split('-').map(Number);
      baseDate = new Date(year, month - 1, day, 0, 0, 0, 0);
    }

    const [hours, minutes] = normalizeGoogleTime(timeValue).split(':').map(Number);
    const parsed = new Date(baseDate.getFullYear(), baseDate.getMonth(), baseDate.getDate(), hours, minutes, 0, 0);
    return Number.isNaN(parsed.getTime()) ? new Date(baseDate.getFullYear(), baseDate.getMonth(), baseDate.getDate(), 9, 0, 0, 0) : parsed;
  }

  async function createGoogleCalendarEvent(activity){
    const accessToken = localStorage.getItem('googleCalendarAccessToken');
    if(!accessToken || !activity || !activity.date || !activity.title) return null;

    const startDateTime = buildGoogleDateTime(activity.date, activity.time);
    const endDateTime = new Date(startDateTime.getTime() + 30 * 60000);

    const eventBody = {
      summary: activity.title,
      description: activity.note || '',
      start: { dateTime: startDateTime.toISOString() },
      end: { dateTime: endDateTime.toISOString() },
      reminders: {
        useDefault: false,
        overrides: [
          { method: 'popup', minutes: 60 },
          { method: 'popup', minutes: 30 },
          { method: 'popup', minutes: 15 }
        ]
      }
    };

    const response = await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events', {
      method: 'POST',
      headers: {
        Authorization: `Bearer ${accessToken}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(eventBody)
    });

    if(!response.ok){
      const errorText = await response.text();
      if(response.status === 401){
        clearGoogleCalendarAuth();
        render();
      }
      throw new Error(errorText || 'Google Calendar error');
    }

    return await response.json();
  }

  // Mensaje pendiente cuando la tarea se guardó pero Google Calendar falló; runAction lo muestra en lugar del aviso normal.
  let googleWarning = null;

  async function googleApi(method, path, body){
    const accessToken = localStorage.getItem('googleCalendarAccessToken');
    const response = await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events${path}`, {
      method,
      headers: {Authorization:`Bearer ${accessToken}`, ...(body ? {'Content-Type':'application/json'} : {})},
      body: body ? JSON.stringify(body) : undefined
    });
    if(response.status === 401){
      clearGoogleCalendarAuth();
      const error = new Error('Google Calendar desconectado');
      error.reconnect = true;
      throw error;
    }
    if(!response.ok){
      const error = new Error(await response.text() || 'Google Calendar error');
      error.status = response.status;
      throw error;
    }
    return response.status === 204 ? null : response.json();
  }

  function addDaysISO(iso, days){
    const [year, month, day] = iso.split('-').map(Number);
    const date = new Date(year, month-1, day+days);
    return date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0');
  }

  // Evento de día completo; el recordatorio llega a las 9:00 del día anterior.
  function taskEventBody(task){
    const venture = state.ventures.find(item=>item.id===task.ventureId);
    return {
      summary: `${task.status==='hecha' ? '✓ ' : ''}${task.title}`,
      description: [`Proyecto: ${venture?.name || ''}`, `Le toca: ${PARTNERS[task.assignee] || 'Ambos'}`, task.notes].filter(Boolean).join('\n') + '\n\nCreada desde Rumbo · Emprende',
      start: {date: task.dueDate},
      end: {date: addDaysISO(task.dueDate, 1)},
      transparency: 'transparent',
      reminders: {useDefault:false, overrides:[{method:'popup', minutes:15*60}]}
    };
  }

  function isMyGoogleTask(task){
    return !!task.googleEventId && task.googleSyncedBy===currentUserId;
  }

  async function deleteGoogleEvent(eventId){
    try{ await googleApi('DELETE', '/'+encodeURIComponent(eventId)); }
    catch(error){ if(error.status!==404 && error.status!==410) throw error; }
  }

  function rememberGoogleError(error){
    console.warn('Google Calendar sync failed', error);
    googleWarning = error.reconnect ? 'Cambios guardados. Vuelve a conectar Google Calendar para sincronizar.' : 'Cambios guardados, pero no se pudo actualizar Google Calendar.';
  }

  // Deja el evento de Google como debe quedar: creado, actualizado o borrado. Solo toca eventos propios,
  // porque cada evento vive en el calendario de quien lo sincronizó.
  async function applyGoogleSync(task, wanted){
    if(!googleCalendarConnected()) return;
    if(task.googleEventId && !isMyGoogleTask(task)) return;
    const shouldExist = wanted && !!task.dueDate;
    try{
      if(isMyGoogleTask(task)){
        if(!shouldExist){
          await deleteGoogleEvent(task.googleEventId);
          await setTaskGoogleEvent(task.id, null);
          return;
        }
        try{
          await googleApi('PATCH', '/'+encodeURIComponent(task.googleEventId), taskEventBody(task));
          return;
        }catch(error){

  /* MenstrualEngineService: predicciones deterministas y cierre automático. */
  const MenstrualEngineService = {
    toDate(value){ return new Date(`${value}T00:00:00`); },
    toISO(date){ return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`; },
    addDays(value, days){ const date=this.toDate(value); date.setDate(date.getDate()+days); return this.toISO(date); },
    daysBetween(start,end){ return Math.round((this.toDate(end)-this.toDate(start))/86400000); },
    getCurrentCycle(cycles){ return cycles.filter(cycle=>!cycle.endDate).sort((a,b)=>b.startDate.localeCompare(a.startDate))[0] || null; },
    getAverageCycleLength(cycles, preferences){
      // Solo los últimos 6 ciclos completados y dentro de 21-45 días evitan sesgar la predicción.
      const valid = cycles.filter(cycle=>cycle.endDate && cycle.cycleLength >= 21 && cycle.cycleLength <= 45).slice(0,6);
      return valid.length ? Math.round(valid.reduce((sum,cycle)=>sum+cycle.cycleLength,0)/valid.length) : (preferences?.default_cycle_length || 28);
    },
    // Fin del periodo: el que marcó la usuaria o, si no, el último día con flujo registrado en los primeros
    // 14 días del ciclo (se tolera un día sin registro entre días con flujo).
    getPeriodEnd(cycle, dailyLogs){
      if(cycle.periodEndDate) return {date:cycle.periodEndDate, explicit:true};
      const flowDates=new Set(dailyLogs.filter(log=>log.flowIntensity!=='none').map(log=>log.date));
      let last=null, gap=0;
      for(let day=0; day<14; day++){
        const date=this.addDays(cycle.startDate,day);
        if(cycle.endDate && date>=cycle.endDate) break;
        if(flowDates.has(date)){ last=date; gap=0; }
        else if(++gap>1) break;
      }
      return last ? {date:last, explicit:false} : null;
    },
    // Un periodo en curso todavía no sirve para el promedio: solo cuenta si se marcó el fin, si el ciclo ya cerró
    // o si pasaron 2 días sin flujo desde el último registrado.
    getPeriodLength(cycle, dailyLogs, today=todayISO()){
      const end=this.getPeriodEnd(cycle,dailyLogs);
      if(!end) return null;
      const settled=end.explicit || !!cycle.endDate || this.daysBetween(end.date,today)>=2;
      return settled ? this.daysBetween(cycle.startDate,end.date)+1 : null;
    },
    getAveragePeriodLength(cycles, dailyLogs, preferences, today=todayISO()){
      const lengths=[...cycles].sort((a,b)=>b.startDate.localeCompare(a.startDate))
        .map(cycle=>this.getPeriodLength(cycle,dailyLogs,today)).filter(length=>length>=1 && length<=14).slice(0,6);
      return lengths.length ? Math.round(lengths.reduce((sum,length)=>sum+length,0)/lengths.length) : (preferences?.default_period_length || 5);
    },
    getCycleLengths(cycles){
      return cycles.filter(cycle=>cycle.endDate && cycle.cycleLength >= 21 && cycle.cycleLength <= 45)
        .sort((a,b)=>b.startDate.localeCompare(a.startDate)).slice(0,6).map(cycle=>cycle.cycleLength);
    },
    standardDeviation(values){
      const mean=values.reduce((sum,value)=>sum+value,0)/values.length;
      return Math.sqrt(values.reduce((sum,value)=>sum+(value-mean)**2,0)/values.length);
    },
    // Detecta la ovulación de un ciclo con la mejor señal disponible: prueba LH > temperatura basal > moco cervical.
    detectOvulation(cycle, dailyLogs){
      const logs=dailyLogs.filter(log=>log.date>=cycle.startDate && (!cycle.endDate || log.date<cycle.endDate)).sort((a,b)=>a.date.localeCompare(b.date));
      // La ovulación suele ocurrir entre 24 y 36 h después del primer positivo de LH. Se ignoran positivos muy tempranos.
      const lhPositive=logs.find(log=>log.lhTest==='positive' && this.daysBetween(cycle.startDate,log.date)>=6);
      if(lhPositive) return {date:this.addDays(lhPositive.date,1), source:'lh'};
      // Regla 3 sobre 6: tres temperaturas seguidas por encima de las 6 anteriores, la tercera al menos 0.2 °C más alta.
      const temps=logs.filter(log=>log.bbt);
      for(let i=6;i+2<temps.length;i++){
        const base=Math.max(...temps.slice(i-6,i).map(log=>log.bbt));
        if(temps[i].bbt>base && temps[i+1].bbt>base && temps[i+2].bbt>=base+0.2) return {date:this.addDays(temps[i].date,-1), source:'bbt'};
      }
      // Día pico del moco: el último día acuoso o tipo clara de huevo, confirmado por un registro posterior más seco.
      const fertileTypes=['eggwhite','watery'];
      const peak=logs.filter(log=>fertileTypes.includes(log.cervicalMucus)).pop();
      if(peak && logs.some(log=>log.date>peak.date && log.cervicalMucus!=='none' && !fertileTypes.includes(log.cervicalMucus))) return {date:peak.date, source:'mucus'};
      return null;
    },
    // Fase lútea personal (de la ovulación al siguiente periodo) con ciclos ya cerrados. Valor típico: 14 días.
    getLutealPhase(cycles, dailyLogs){
      const lengths=cycles.filter(cycle=>cycle.endDate).sort((a,b)=>b.startDate.localeCompare(a.startDate))
        .map(cycle=>{ const ovulation=this.detectOvulation(cycle,dailyLogs); return ovulation ? this.daysBetween(ovulation.date,cycle.endDate) : null; })
        .filter(length=>length>=9 && length<=17).slice(0,6);
      return {length: lengths.length ? Math.round(lengths.reduce((sum,length)=>sum+length,0)/lengths.length) : 14, fromData:lengths.length};
    },
    getPrediction(cycles, preferences, dailyLogs=[], today=todayISO()){
      const average=this.getAverageCycleLength(cycles,preferences);
      const periodLength=this.getAveragePeriodLength(cycles,dailyLogs,preferences,today);
      const lengths=this.getCycleLengths(cycles);
      const luteal=this.getLutealPhase(cycles,dailyLogs);
      const current=this.getCurrentCycle(cycles);
      const base={current,average,periodLength,luteal,cycleCount:lengths.length};
      if(!current) return {...base,cycleDay:null,currentPeriodEnd:null,nextPeriod:null,ovulation:null,fertileStart:null,fertileEnd:null,periodEnd:null};
      const detected=this.detectOvulation(current,dailyLogs);
      let nextPeriod, margin, ovulation, fertileStart, fertileEnd;
      if(detected){
        // Con la ovulación detectada, el periodo llega una fase lútea después; la fase lútea varía poco.
        ovulation=detected.date;
        nextPeriod=this.addDays(ovulation,luteal.length);
        margin=1;
        fertileStart=this.addDays(ovulation,-5);
        fertileEnd=this.addDays(ovulation,1);
      } else {
        // Margen según cuánto varían tus ciclos; con menos de 3 ciclos se usa ±2 días.
        margin=lengths.length>=3 ? Math.min(7,Math.max(1,Math.round(this.standardDeviation(lengths)))) : 2;
        nextPeriod=this.addDays(current.startDate,average);
        ovulation=this.addDays(nextPeriod,-luteal.length);
        fertileStart=this.addDays(ovulation,-margin-5);
        fertileEnd=this.addDays(ovulation,margin+1);
      }
      return {
        ...base, detectedOvulation:detected, margin,
        cycleDay:Math.max(1,this.daysBetween(current.startDate,today)+1),
        currentPeriodEnd:this.getPeriodEnd(current,dailyLogs),
        nextPeriod, nextPeriodEarliest:this.addDays(nextPeriod,-margin), nextPeriodLatest:this.addDays(nextPeriod,margin),
        ovulation, fertileStart, fertileEnd, periodEnd:this.addDays(nextPeriod,periodLength-1)
      };
    },
    // Ciclo al que pertenece una fecha si cae dentro de los primeros 14 días (donde puede estar el periodo).
    getCycleForPeriodDate(cycles, date){
      return cycles.find(cycle=>date>=cycle.startDate && this.daysBetween(cycle.startDate,date)<=13 && (!cycle.endDate || date<cycle.endDate)) || null;
    },
    shouldCloseCycle(current, log){ return log.flowIntensity!=='none' && current && this.daysBetween(current.startDate,log.date)>=10; },
    estimatePregnancyRisk(prediction, dailyLogs){
      if(!prediction.ovulation) return {probability:0,level:'low',label:'Sin datos'};
      const encounters=dailyLogs.filter(log=>log.hadSex);
      if(!encounters.length) return {probability:0,level:'low',label:'Sin actividad registrada'};
      let combinedNotPregnant=1;
      encounters.forEach(log=>{
        const diff=Math.abs(this.daysBetween(log.date,prediction.ovulation));
        const inFertile=log.date>=prediction.fertileStart && log.date<=prediction.fertileEnd;
        let chance=0.01;
        if(inFertile){
          if(diff===0) chance=0.33;
          else if(diff===1) chance=0.30;
          else if(diff===2) chance=0.27;
          else if(diff===3) chance=0.20;
          else chance=0.12;
        } else if(diff<=7) chance=0.04;
        if(log.protectionUsed===true) chance*=0.25;
        if(log.protectionUsed===null) chance*=0.85;
        combinedNotPregnant*= (1-Math.min(chance,0.95));
      });
      const probability=Math.round((1-combinedNotPregnant)*100);
      const level=probability>=20?'high':probability>=8?'medium':'low';
      const label=level==='high'?'Probabilidad alta':level==='medium'?'Probabilidad media':'Probabilidad baja';
      return {probability,level,label};
    }
  };

  async function saveDailyLog(data){
    const user=(await supabase.auth.getUser()).data.user;
    const current=MenstrualEngineService.getCurrentCycle(state.menstrual.cycles);
    const log={
      user_id:user.id,
      date:data.date,
      flow_intensity:data.flowIntensity,
      symptoms:data.symptoms||[],
      mood:data.mood||[],
      had_sex:!!data.hadSex,
      protection_used:data.hadSex ? !!data.protectionUsed : null,
      lh_test:data.lhTest||'none',
      cervical_mucus:data.cervicalMucus||'none',
      bbt:data.bbt ? Number(data.bbt) : null
    };
    const {error:logError}=await supabase.from('daily_logs').upsert(log,{onConflict:'user_id,date'});
    if(logError) throw logError;
    if(!current && data.flowIntensity!=='none'){
      const {error:firstCycleError}=await supabase.from('cycles').insert({user_id:user.id,start_date:data.date});
      if(firstCycleError) throw firstCycleError;
    }
    if(MenstrualEngineService.shouldCloseCycle(current,data)){
      const {error:closeError}=await supabase.from('cycles').update({end_date:data.date,cycle_length:MenstrualEngineService.daysBetween(current.startDate,data.date)}).eq('id',current.id);
      if(closeError) throw closeError;
      const {error:newCycleError}=await supabase.from('cycles').insert({user_id:user.id,start_date:data.date});
      if(newCycleError) throw newCycleError;
    }
    await loadData();
    const cycle=MenstrualEngineService.getCycleForPeriodDate(state.menstrual.cycles,data.date);
    if(!cycle) return;
    let periodEnd=cycle.periodEndDate;
    if(data.periodEnd) periodEnd=data.date;
    else if(cycle.periodEndDate===data.date) periodEnd=null;
    // Si sigue habiendo sangrado después del fin marcado, el periodo se extiende hasta ese día.
    else if(cycle.periodEndDate && data.flowIntensity!=='none' && data.date>cycle.periodEndDate) periodEnd=data.date;
    if(periodEnd!==cycle.periodEndDate){
      await setPeriodEnd(cycle.id,periodEnd);
      await loadData();
    }
  }

  /* ---------------- HELPERS ---------------- */
  function fmtMoney(n){
    n = Number(n)||0;
    return n.toLocaleString('es-MX', {style:'currency', currency:'MXN', maximumFractionDigits:0});
  }
  function fmtDate(d){
    const dt = new Date(d + 'T00:00:00');
    return dt.toLocaleDateString('es-MX', {day:'numeric', month:'short', year:'numeric'});
  }
  function monthsBetween(a,b){
    let months = (b.getFullYear()-a.getFullYear())*12 + (b.getMonth()-a.getMonth());
    if(b.getDate() < a.getDate()) months -= 1;
    return months;
  }
  function todayISO(){
    const d = new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }

  function computeQuote(plan){
    const today = new Date();
    const target = new Date(plan.targetDate + 'T00:00:00');
    const created = new Date(plan.createdAt + 'T00:00:00');
    const saved = plan.contributions.reduce((s,c)=>s+Number(c.amount),0) + Number(plan.initial||0);
    const cost = Number(plan.targetCost)||0;
    const remaining = Math.max(0, cost - saved);
    let monthsLeft = monthsBetween(today, target);
    monthsLeft = monthsLeft < 1 ? 1 : monthsLeft;
    const overdue = target < today && saved < cost;
    const monthly = overdue ? remaining : remaining / monthsLeft;
    const weekly = monthly / 4.345;
    const totalMonths = Math.max(1, monthsBetween(created, target));
    const elapsedMonths = Math.max(0, monthsBetween(created, today));
    const expectedFrac = Math.min(1, elapsedMonths/totalMonths);
    const actualFrac = cost > 0 ? Math.min(1, saved/cost) : 0;
    let status = 'ok';
    if(saved >= cost && cost>0) status = 'done';
    else if(overdue) status = 'warn';
    else if(actualFrac < expectedFrac - 0.12) status = 'warn';
    return { saved, cost, remaining, monthsLeft, monthly, weekly, pct: cost>0 ? Math.min(100, Math.round((saved/cost)*100)) : 0, status, overdue };
  }

  function statusLabel(s){
    return s==='done' ? 'Completado' : s==='warn' ? 'Atrasado' : 'En camino';
  }
  function statusColorVar(s){
    return s==='done' ? 'var(--gold)' : s==='warn' ? 'var(--coral)' : 'var(--teal-2)';
  }

  function planCard(p){
    const q = computeQuote(p);
    const cat = CATEGORIES[p.category] || CATEGORIES.otro;

      <div class="plan-card">
