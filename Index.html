<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rumbo — Planea y ahorra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F7F2;
    --surface:#FFFFFF;
    --surface-alt:#EEF1EA;
    --ink:#182420;
    --ink-soft:#5B6860;
    --ink-faint:#8A968E;
    --teal:#173F37;
    --teal-2:#1F5548;
    --teal-soft:#DCE7E1;
    --gold:#C0923F;
    --gold-soft:#F3E7CB;
    --coral:#BD6248;
    --coral-soft:#F4E1D8;
    --sage:#7FA189;
    --border:#DFE4DA;
    --radius-sm:10px;
    --radius-md:16px;
    --radius-lg:26px;
    --shadow-sm:0 2px 8px -4px rgba(23,36,32,0.15);
    --shadow-md:0 12px 32px -16px rgba(23,36,32,0.28);
    --font-display:'Fraunces', serif;
    --font-body:'Manrope', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    background-image:
      radial-gradient(circle at 100% 0%, rgba(192,146,63,0.07), transparent 45%),
      radial-gradient(circle at 0% 100%, rgba(23,63,55,0.06), transparent 40%);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--gold-soft);}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  a{color:inherit;}

  .app{display:flex;min-height:100vh;}

  /* SIDEBAR */
  .sidebar{
    width:236px;flex-shrink:0;
    background:var(--teal);
    color:#EFEFE8;
    padding:28px 20px;
    display:flex;flex-direction:column;
    position:sticky;top:0;height:100vh;
  }
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .brand-mark{
    width:34px;height:34px;border-radius:9px;
    background:linear-gradient(155deg,var(--gold) 0%, #a97c30 100%);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);font-weight:700;font-size:17px;color:var(--teal);
    flex-shrink:0;
  }
  .brand-name{font-family:var(--font-display);font-size:21px;font-weight:600;letter-spacing:0.2px;}
  .brand-tag{font-size:11.5px;color:#B7C6BE;margin:0 0 30px 44px;letter-spacing:.2px;}
  .nav{display:flex;flex-direction:column;gap:3px;margin-top:6px;}
  .nav-item{
    display:flex;align-items:center;gap:11px;
    padding:10px 12px;border-radius:11px;
    color:#CBD8CF;background:transparent;border:none;
    font-size:14.5px;font-weight:600;text-align:left;
    transition:background .15s ease, color .15s ease;
  }
  .nav-item svg{width:18px;height:18px;flex-shrink:0;opacity:.85;}
  .nav-item:hover{background:rgba(255,255,255,0.07);color:#fff;}
  .nav-item.active{background:rgba(255,255,255,0.13);color:#fff;}
  .nav-item.active svg{opacity:1;}
  .sidebar-foot{margin-top:auto;padding-top:20px;border-top:1px solid rgba(255,255,255,0.12);}
  .sidebar-stat{font-family:var(--font-mono);font-size:12px;color:#9FB2A7;line-height:1.7;}
  .sidebar-stat b{color:#F1D8A0;font-weight:600;}

  /* MAIN */
  .main{flex:1;min-width:0;padding:36px 44px 60px;}
  .session-bar{display:flex;justify-content:flex-end;align-items:center;gap:12px;margin-bottom:18px;}
  .topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:30px;flex-wrap:wrap;}
  .page-title{font-family:var(--font-display);font-size:32px;font-weight:600;margin:0 0 4px;}
  .page-sub{color:var(--ink-soft);font-size:14.5px;margin:0;max-width:520px;}
  .btn{
    display:inline-flex;align-items:center;gap:8px;
    border:none;border-radius:12px;padding:11px 18px;
    font-size:14px;font-weight:700;letter-spacing:.1px;
    transition:transform .12s ease, box-shadow .12s ease, background .15s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--teal);color:#fff;box-shadow:var(--shadow-sm);}
  .btn-primary:hover{background:var(--teal-2);}
  .btn-gold{background:var(--gold);color:#2B2007;}
  .btn-gold:hover{background:#CBA254;}
  .btn-ghost{background:var(--surface);color:var(--ink);border:1px solid var(--border);}
  .btn-ghost:hover{background:var(--surface-alt);}
  .btn-sm{padding:8px 13px;font-size:13px;border-radius:10px;}
  .btn-icon{width:34px;height:34px;padding:0;justify-content:center;border-radius:10px;background:var(--surface);border:1px solid var(--border);color:var(--ink-soft);}
  .btn-icon:hover{background:var(--surface-alt);color:var(--ink);}
  .btn svg{width:15px;height:15px;}

  /* DASHBOARD HERO STATS */
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:32px;}
  .stat-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);
    padding:20px 20px 18px;position:relative;overflow:hidden;
  }
  .stat-card.accent{background:var(--teal);color:#fff;border:none;}
  .stat-label{font-size:12px;text-transform:uppercase;letter-spacing:.7px;font-weight:700;color:var(--ink-faint);}
  .stat-card.accent .stat-label{color:#AFC3B6;}
  .stat-value{font-family:var(--font-mono);font-size:26px;font-weight:600;margin-top:8px;letter-spacing:-0.5px;}
  .stat-foot{font-size:12.5px;color:var(--ink-faint);margin-top:6px;}
  .stat-card.accent .stat-foot{color:#C7D6CC;}

  .section-head{display:flex;align-items:baseline;justify-content:space-between;margin:38px 0 16px;}
  .section-title{font-family:var(--font-display);font-size:19px;font-weight:600;margin:0;}
  .section-link{font-size:13px;font-weight:700;color:var(--teal-2);background:none;border:none;}

  /* PLAN CARDS */
  .plan-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:18px;}
  .plan-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
    padding:22px;display:flex;flex-direction:column;gap:14px;
    box-shadow:var(--shadow-sm); position:relative;
    transition:box-shadow .18s ease, transform .18s ease;
  }
  .plan-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);}
  .plan-card-top{display:flex;align-items:flex-start;justify-content:space-between;}
  .plan-icon{
    width:42px;height:42px;border-radius:12px;background:var(--surface-alt);
    display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;
  }
  .plan-menu-btn{background:none;border:none;color:var(--ink-faint);width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;}
  .plan-menu-btn:hover{background:var(--surface-alt);color:var(--ink);}
  .plan-body{display:flex;gap:16px;align-items:center;}
  .ring{
    --pct:0;
    width:74px;height:74px;border-radius:50%;flex-shrink:0;
    background:conic-gradient(var(--ring-color,var(--teal-2)) calc(var(--pct)*1%), var(--surface-alt) 0);
    display:flex;align-items:center;justify-content:center;
  }
  .ring-inner{
    width:56px;height:56px;border-radius:50%;background:var(--surface);
    display:flex;align-items:center;justify-content:center;flex-direction:column;
  }
  .ring-pct{font-family:var(--font-mono);font-weight:600;font-size:14px;}
  .plan-name{font-family:var(--font-display);font-size:17.5px;font-weight:600;margin:0 0 3px;line-height:1.25;}
  .plan-cat{font-size:11.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.5px;font-weight:700;}
  .plan-amounts{font-family:var(--font-mono);font-size:13px;color:var(--ink-soft);margin-top:6px;}
  .plan-amounts b{color:var(--ink);font-weight:600;}
  .status-pill{
    display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;
    padding:4px 10px;border-radius:99px;width:fit-content;
  }
  .status-pill.ok{background:var(--teal-soft);color:var(--teal-2);}
  .status-pill.warn{background:var(--coral-soft);color:var(--coral);}
  .status-pill.done{background:var(--gold-soft);color:#8A6B27;}
  .plan-foot{display:flex;align-items:center;justify-content:space-between;border-top:1px dashed var(--border);padding-top:13px;margin-top:2px;}
  .plan-foot-date{font-size:12.5px;color:var(--ink-soft);}
  .plan-foot-date b{color:var(--ink);}
  .plan-actions{display:flex;gap:8px;}

  .empty-state{
    border:1.5px dashed var(--border);border-radius:var(--radius-lg);
    padding:52px 30px;text-align:center;color:var(--ink-soft);background:var(--surface);
  }
  .empty-state h3{font-family:var(--font-display);font-size:20px;color:var(--ink);margin:14px 0 6px;}
  .empty-emoji{font-size:34px;}

  /* CALENDAR */
  .cal-wrap{display:grid;grid-template-columns:1.55fr 1fr;gap:24px;align-items:start;}
  .cal-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;box-shadow:var(--shadow-sm);}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
  .cal-month{font-family:var(--font-display);font-size:20px;font-weight:600;text-transform:capitalize;}
  .cal-nav{display:flex;gap:6px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:78px;gap:6px;}
  .cal-dow{text-align:center;font-size:11px;font-weight:700;color:var(--ink-faint);padding-bottom:6px;text-transform:uppercase;}
  .cal-day{
    height:78px;min-height:78px;border-radius:11px;padding:7px 8px;background:var(--surface-alt);
    display:flex;flex-direction:column;justify-content:space-between;font-size:12.5px;color:var(--ink-soft);
    position:relative;cursor:pointer;transition:background .15s ease,box-shadow .15s ease;
  }
  .cal-day:not(.empty):hover{background:var(--teal-soft);box-shadow:inset 0 0 0 1px var(--teal-2);}
  .cal-day.empty{background:transparent;}
  .cal-day.today{outline:2px solid var(--teal-2);outline-offset:-2px;}
  .cal-day-num{font-family:var(--font-mono);font-weight:600;}
  .cal-dots{display:flex;gap:3px;flex-wrap:wrap;}
  .cal-dot{width:7px;height:7px;border-radius:50%;background:var(--gold);}
  .cal-day .cal-emojis{font-size:13px;line-height:1;}
  .cal-activities{display:flex;flex-direction:column;gap:3px;overflow:hidden;margin-top:3px;max-height:48px;}
  .cal-activity{display:flex;align-items:center;gap:4px;min-width:0;font-size:10px;line-height:1.2;color:var(--ink);font-weight:700;}
  .cal-activity-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;background:var(--activity-color,var(--gold));}
  .cal-activity-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cal-activity-more{font-size:9px;color:var(--ink-faint);font-family:var(--font-mono);}

  .side-list{display:flex;flex-direction:column;gap:12px;}
  .agenda-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow-sm);}
  .agenda-title{font-family:var(--font-display);font-size:16.5px;font-weight:600;margin:0 0 12px;}
  .agenda-item{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--border);}
  .agenda-item:last-child{border-bottom:none;}
  .agenda-emoji{width:34px;height:34px;border-radius:9px;background:var(--surface-alt);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
  .agenda-name{font-size:13.5px;font-weight:700;}
  .agenda-sub{font-size:11.5px;color:var(--ink-faint);font-family:var(--font-mono);}
  .agenda-check{margin-left:auto;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;}
  .agenda-check.pending{background:var(--coral-soft);color:var(--coral);}
  .agenda-check.done{background:var(--teal-soft);color:var(--teal-2);}
  .muted-empty{font-size:13px;color:var(--ink-faint);padding:8px 0;}

  /* MODAL */
  .overlay{
    position:fixed;inset:0;background:rgba(15,22,19,0.5);backdrop-filter:blur(2px);
    display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;
    opacity:0;pointer-events:none;transition:opacity .18s ease;
  }
  .overlay.show{opacity:1;pointer-events:auto;}
  .modal{
    background:var(--surface);border-radius:var(--radius-lg);width:100%;max-width:480px;
    max-height:88vh;overflow-y:auto;padding:28px;box-shadow:0 30px 60px -20px rgba(0,0,0,0.35);
    transform:translateY(8px);transition:transform .18s ease;
  }
  .overlay.show .modal{transform:translateY(0);}
  .modal-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;}
  .modal-title{font-family:var(--font-display);font-size:22px;font-weight:600;margin:0;}
  .modal-close{background:var(--surface-alt);border:none;width:30px;height:30px;border-radius:9px;color:var(--ink-soft);flex-shrink:0;}
  .modal-close:hover{background:var(--border);}
  .field{margin-bottom:15px;}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:6px;}
  .field input, .field select, .field textarea{
    width:100%;border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;
    font-size:14px;color:var(--ink);background:var(--bg);outline:none;transition:border-color .15s ease;
  }
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--teal-2);}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;}

  /* DETAIL MODAL QUOTE BOX */
  .quote-box{background:var(--teal);color:#fff;border-radius:var(--radius-md);padding:19px 20px;margin:16px 0;}
  .quote-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:13.5px;border-bottom:1px solid rgba(255,255,255,0.12);}
  .quote-row:last-child{border-bottom:none;}
  .quote-row span:first-child{color:#B7C6BE;}
  .quote-row b{font-family:var(--font-mono);font-weight:600;font-size:14.5px;}
  .quote-highlight{background:rgba(192,146,63,0.22);border-radius:10px;padding:12px 14px;margin-top:8px;}
  .quote-highlight .quote-row{border:none;padding:3px 0;}
  .quote-highlight span:first-child{color:#F1D8A0;}
  .quote-highlight b{color:#fff;}

  .contrib-list{display:flex;flex-direction:column;gap:8px;margin-top:6px;max-height:160px;overflow-y:auto;}
  .contrib-item{display:flex;align-items:center;gap:8px;font-size:13px;padding:8px 11px;background:var(--surface-alt);border-radius:9px;}
  .contrib-item b{font-family:var(--font-mono);color:var(--teal-2);}
  .contrib-item-main{display:flex;justify-content:space-between;align-items:center;gap:10px;min-width:0;flex:1;}
  .contrib-item-main span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .contrib-actions{display:flex;gap:4px;flex-shrink:0;}
  .contrib-action{border:0;background:transparent;color:var(--ink-faint);font-size:12px;padding:4px 6px;border-radius:6px;}
  .contrib-action:hover{background:var(--surface);color:var(--ink);}
  .contrib-action.delete:hover{background:var(--coral-soft);color:var(--coral);}

  .toast{
    position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-size:13.5px;font-weight:600;
    box-shadow:var(--shadow-md);opacity:0;pointer-events:none;transition:all .22s ease;z-index:80;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .mobile-nav{display:none;}

  .auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg);}
  .auth-panel{width:min(420px,100%);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:32px;box-shadow:var(--shadow-md);}
  .auth-panel .brand{color:var(--teal);margin-bottom:10px;}
  .auth-panel h1{font-family:var(--font-display);font-size:28px;margin:24px 0 6px;}
  .auth-panel p{color:var(--ink-soft);font-size:14px;line-height:1.5;margin:0 0 22px;}
  .auth-error{color:var(--coral);font-size:13px;min-height:20px;margin-top:10px;}
  .user-menu{display:flex;align-items:center;gap:10px;color:var(--ink-soft);font-size:12px;}
  .user-email{max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .menstrual-layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,1fr);gap:22px;align-items:start;}
  .cycle-calendar{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;box-shadow:var(--shadow-sm);}
  .cycle-legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px;color:var(--ink-soft);font-size:11.5px;}
  .cycle-legend span{display:inline-flex;align-items:center;gap:5px;}
  .legend-dot{width:9px;height:9px;border-radius:50%;background:var(--coral);}
  .legend-ring{width:11px;height:11px;border:2px solid var(--coral);border-radius:50%;}
  .legend-blue{width:10px;height:10px;border-radius:50%;background:#5486a6;}
  .legend-sex{font-size:12px;line-height:1;}
  .cycle-grid .cal-day{height:86px;min-height:86px;justify-content:flex-start;gap:4px;}
  .cycle-grid{grid-auto-rows:86px;}
  .cycle-day-number{display:flex;align-items:center;justify-content:space-between;font-family:var(--font-mono);font-weight:600;}
  .cycle-day-number .flow-mark{width:8px;height:8px;border-radius:50%;background:var(--coral);}
  .sex-mark{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:999px;background:rgba(84,134,166,.16);font-size:10px;line-height:1;}
  .sex-mark.unprotected{background:rgba(189,98,72,.16);}
  .cycle-day.predicted{box-shadow:inset 0 0 0 2px var(--coral);background:#fff9f6;}
  .cycle-day.fertile{background:#eaf3f7;}
  .cycle-day.ovulation{background:#d8e9f1;box-shadow:inset 0 0 0 2px #5486a6;}
  .cycle-day.today .cycle-day-number{color:var(--teal-2);}
  button.cycle-day{font-family:inherit;text-align:left;border:0;width:100%;}
  .cycle-day-label{font-size:9.5px;color:#5486a6;font-weight:800;text-transform:uppercase;letter-spacing:.2px;}
  .tracking-card,.prediction-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;box-shadow:var(--shadow-sm);}
  .prediction-card{background:var(--teal);color:#fff;border:0;}
  .prediction-card .agenda-title{color:#fff;}
  .prediction-main{font-family:var(--font-display);font-size:27px;line-height:1.1;margin:8px 0 5px;}
  .prediction-sub{color:#c7d6cc;font-size:13px;line-height:1.45;}
  .prediction-meta{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:18px;}
  .prediction-meta div{padding:10px;background:rgba(255,255,255,.1);border-radius:10px;}
  .prediction-meta small{display:block;color:#b7c6be;font-size:10px;text-transform:uppercase;letter-spacing:.5px;font-weight:700;}
  .prediction-meta b{display:block;margin-top:4px;font-family:var(--font-mono);font-size:12px;}
  .pregnancy-pill{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:6px 10px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.2px;text-transform:uppercase;}
  .pregnancy-pill.low{background:rgba(127,161,137,.2);color:#d8efe1;}
  .pregnancy-pill.medium{background:rgba(192,146,63,.22);color:#f7e6bc;}
  .pregnancy-pill.high{background:rgba(189,98,72,.24);color:#ffd2c5;}
  .tracking-card{margin-top:16px;}
  .tracking-card .field{margin-bottom:12px;}
  .choice-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
  .choice-grid label{position:relative;}
  .choice-grid input{position:absolute;opacity:0;pointer-events:none;}
  .choice-grid span{display:flex;align-items:center;justify-content:center;min-height:38px;padding:5px;border:1px solid var(--border);border-radius:9px;font-size:11px;color:var(--ink-soft);text-align:center;cursor:pointer;}
  .choice-grid input:checked+span{background:var(--coral-soft);border-color:var(--coral);color:var(--coral);font-weight:800;}
  .chip-grid{display:flex;flex-wrap:wrap;gap:6px;}
  .chip-grid label{position:relative;}
  .chip-grid input{position:absolute;opacity:0;pointer-events:none;}

</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  "use strict";

  /* ---------------- DATA LAYER ---------------- */
  let supabase = null;
  let realtimeChannel = null;
  let state = { plans: [], activities: [], menstrual: { preferences: null, cycles: [], dailyLogs: [] } };
  let currentView = 'dashboard';
  let calDate = new Date();
  let activeDetailId = null;
  let activeActivityDate = null;
  let currentUserEmail = '';

  const CATEGORIES = {
    viaje:     {label:'Viaje',       emoji:'✈️'},
    vivienda:  {label:'Vivienda',    emoji:'🏠'},
    vehiculo:  {label:'Vehículo',    emoji:'🚗'},
    educacion: {label:'Educación',   emoji:'🎓'},
    boda:      {label:'Boda',        emoji:'💍'},
    tecnologia:{label:'Tecnología',  emoji:'💻'},
    salud:     {label:'Salud',       emoji:'🩺'},
    otro:      {label:'Otro',        emoji:'⭐'}
  };

  function uid(){ return 'p_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

  function fromRows(plans, contributions, activities, preferences, cycles, dailyLogs){
    const grouped = contributions.reduce((map, contribution)=>{
      (map[contribution.plan_id] ||= []).push({id:contribution.id, amount:Number(contribution.amount), date:contribution.date, note:contribution.note||''});
      return map;
    }, {});
    return {plans:plans.map(plan=>({
      id:plan.id, name:plan.name, category:plan.category, description:plan.description||'',
      targetCost:Number(plan.target_cost), targetDate:plan.target_date, initial:Number(plan.initial||0),
      createdAt:plan.created_at.slice(0,10), contributions:grouped[plan.id]||[]
    })), activities:(activities||[]).map(activity=>({
      id:activity.id, title:activity.title, date:activity.date, time:activity.time||'',
      note:activity.note||'', color:activity.color||'gold', reminderAt:activity.reminder_at || null, reminderSent:!!activity.reminder_sent
    })), menstrual:{
      preferences:preferences || {default_cycle_length:28,default_period_length:5},
      cycles:(cycles||[]).map(cycle=>({id:cycle.id,userId:cycle.user_id,startDate:cycle.start_date,endDate:cycle.end_date,cycleLength:cycle.cycle_length})),
      dailyLogs:(dailyLogs||[]).map(log=>({
        id:log.id,
        userId:log.user_id,
        date:log.date,
        flowIntensity:log.flow_intensity,
        symptoms:log.symptoms||[],
        mood:log.mood||[],
        hadSex:!!log.had_sex,
        protectionUsed:log.protection_used===null?null:!!log.protection_used
      }))
    }};
  }

  async function loadData(){
    const [{data:plans,error:plansError},{data:contributions,error:contributionsError},{data:activities,error:activitiesError},{data:preferences,error:preferencesError},{data:cycles,error:cyclesError},{data:dailyLogs,error:logsError}] = await Promise.all([
      supabase.from('plans').select('*').order('target_date'),
      supabase.from('contributions').select('*').order('date',{ascending:false}),
      supabase.from('activities').select('*').order('date').order('time'),
      supabase.from('user_preferences').select('*').eq('user_id',(await supabase.auth.getUser()).data.user.id).maybeSingle(),
      supabase.from('cycles').select('*').order('start_date',{ascending:false}),
      supabase.from('daily_logs').select('*').order('date',{ascending:false})
    ]);
    if(plansError) throw plansError;
    if(contributionsError) throw contributionsError;
    if(activitiesError) throw activitiesError;
    if(preferencesError) throw preferencesError;
    if(cyclesError) throw cyclesError;
    if(logsError) throw logsError;
    state = fromRows(plans||[], contributions||[], activities||[], preferences, cycles, dailyLogs);
    scheduleActivityNotifications();
  }

  function subscribeToChanges(){
    if(realtimeChannel) supabase.removeChannel(realtimeChannel);
    realtimeChannel = supabase.channel('rumbo-shared-data')
      .on('postgres_changes',{event:'*',schema:'public',table:'plans'},refreshFromRealtime)
      .on('postgres_changes',{event:'*',schema:'public',table:'contributions'},refreshFromRealtime)
      .on('postgres_changes',{event:'*',schema:'public',table:'activities'},refreshFromRealtime)
      .on('postgres_changes',{event:'*',schema:'public',table:'user_preferences'},refreshFromRealtime)
      .on('postgres_changes',{event:'*',schema:'public',table:'cycles'},refreshFromRealtime)
      .on('postgres_changes',{event:'*',schema:'public',table:'daily_logs'},refreshFromRealtime)
      .subscribe();
  }

  function authErrorMessage(error){
    const message = String(error?.message || '').toLowerCase();
    if(message.includes('email not confirmed')) return 'Confirma el correo del usuario en Supabase Auth antes de iniciar sesión.';
    if(message.includes('invalid login credentials')) return 'El correo o la contraseña no coinciden. El UID no se usa para iniciar sesión.';
    if(message.includes('email rate limit')) return 'Supabase bloqueó temporalmente los intentos. Espera unos minutos y vuelve a probar.';
    return error?.message || 'No se pudo iniciar sesión.';
  }

  let refreshTimer = null;
  async function refreshFromRealtime(){
    clearTimeout(refreshTimer);
    refreshTimer = setTimeout(async()=>{
      try{ await loadData(); render(); }catch(e){ showToast('No se pudo actualizar la información.'); }
    }, 120);
  }

  async function createPlan(data){
    const {error} = await supabase.from('plans').insert({name:data.name,category:data.category,target_date:data.targetDate,target_cost:Number(data.targetCost),description:data.description||'',initial:Number(data.initial)||0});
    if(error) throw error;
  }

  async function updatePlan(id,data){
    const {error} = await supabase.from('plans').update({name:data.name,category:data.category,target_date:data.targetDate,target_cost:Number(data.targetCost),description:data.description||''}).eq('id',id);
    if(error) throw error;
  }

  async function createContribution(planId,data){
    const {error} = await supabase.from('contributions').insert({plan_id:planId,amount:Number(data.amount),date:data.date,note:data.note||''});
    if(error) throw error;
  }

  async function updateContribution(id,data){
    const {error} = await supabase.from('contributions').update({amount:Number(data.amount),date:data.date,note:data.note||''}).eq('id',id);
    if(error) throw error;
  }

  async function removeContribution(id){
    const {error} = await supabase.from('contributions').delete().eq('id',id);
    if(error) throw error;
  }

  async function removePlan(id){
    const {error} = await supabase.from('plans').delete().eq('id',id);
    if(error) throw error;
  }

  const activityReminderTimers = new Map();

  function localDateTimeForInput(date = new Date()){
    const pad = (value) => String(value).padStart(2,'0');
    return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
  }

  function formatDateTimeLocal(value){
    return value ? localDateTimeForInput(new Date(value)) : '';
  }

  function formatReminderText(value){
    if(!value) return '';
    const date = new Date(value);
    if(Number.isNaN(date.getTime())) return '';
    return date.toLocaleString('es-MX', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
  }

  async function ensureNotificationPermission(){
    if(!('Notification' in window)){
      showToast('Este navegador no soporta notificaciones web.');
      return false;
    }
    if(Notification.permission === 'granted') return true;
    if(Notification.permission === 'denied'){
      showToast('Las notificaciones están bloqueadas para este navegador.');
      return false;
    }
    const result = await Notification.requestPermission();
    if(result === 'granted') return true;
    showToast('Debes permitir notificaciones para recibir recordatorios.');
    return false;
  }

  function scheduleActivityNotifications(){
    activityReminderTimers.forEach((timer)=>clearTimeout(timer));
    activityReminderTimers.clear();
    const now = Date.now();
    state.activities.forEach((activity)=>{
      if(!activity.reminderAt || activity.reminderSent) return;
      const reminderTime = new Date(activity.reminderAt).getTime();
      if(Number.isNaN(reminderTime) || reminderTime <= now) return;
      const delay = reminderTime - now;
      const timer = setTimeout(async()=>{
        const hasPermission = 'Notification' in window && Notification.permission === 'granted';
        if(hasPermission){
          new Notification('Recordatorio de actividad', {
            body: `${activity.title}${activity.note ? ' · ' + activity.note : ''}`,
            tag: `activity-${activity.id}`
          });
        }
        const {error} = await supabase.from('activities').update({reminder_sent: true}).eq('id', activity.id);
        if(!error){
          const match = state.activities.find(item=>item.id===activity.id);
          if(match) match.reminderSent = true;
        }
      }, delay);
      activityReminderTimers.set(activity.id, timer);
    });
  }

  async function createActivity(data){
    const reminderEnabled = !!(data.reminderEnabled && data.reminderAt);
    const reminderAt = reminderEnabled ? new Date(data.reminderAt + ':00').toISOString() : null;
    if(reminderEnabled){
      await ensureNotificationPermission();
    }
    const {error} = await supabase.from('activities').insert({
      title:data.title,
      date:data.date,
      time:data.time||null,
      note:data.note||'',
      color:data.color||'gold',
      reminder_at: reminderAt,
      reminder_sent: false
    });
    if(error) throw error;
    await loadData();
    scheduleActivityNotifications();
  }

  async function removeActivity(id){
    const {error} = await supabase.from('activities').delete().eq('id',id);
    if(error) throw error;
  }

  /* MenstrualEngineService: predicciones deterministas y cierre automático. */
  const MenstrualEngineService = {
    toDate(value){ return new Date(`${value}T00:00:00`); },
    toISO(date){ return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`; },
    addDays(value, days){ const date=this.toDate(value); date.setDate(date.getDate()+days); return this.toISO(date); },
    daysBetween(start,end){ return Math.round((this.toDate(end)-this.toDate(start))/86400000); },
    getCurrentCycle(cycles){ return cycles.filter(cycle=>!cycle.endDate).sort((a,b)=>b.startDate.localeCompare(a.startDate))[0] || null; },
    getAverageCycleLength(cycles, preferences){
      // Solo los últimos 6 ciclos completados y dentro de 21-45 días evitan sesgar la predicción.
      const valid = cycles.filter(cycle=>cycle.endDate && cycle.cycleLength >= 21 && cycle.cycleLength <= 45).slice(0,6);
      return valid.length ? Math.round(valid.reduce((sum,cycle)=>sum+cycle.cycleLength,0)/valid.length) : (preferences?.default_cycle_length || 28);
    },
    getPrediction(cycles, preferences, today=todayISO()){
      const current=this.getCurrentCycle(cycles);
      if(!current) return {current:null,cycleDay:null,average:this.getAverageCycleLength(cycles,preferences),nextPeriod:null,ovulation:null,fertileStart:null,fertileEnd:null,periodEnd:null};
      const average=this.getAverageCycleLength(cycles,preferences);
      const nextPeriod=this.addDays(current.startDate,average);
      return {current,cycleDay:Math.max(1,this.daysBetween(current.startDate,today)+1),average,nextPeriod,ovulation:this.addDays(nextPeriod,-14),fertileStart:this.addDays(nextPeriod,-19),fertileEnd:this.addDays(nextPeriod,-13),periodEnd:this.addDays(nextPeriod,(preferences?.default_period_length||5)-1)};
    },
    shouldCloseCycle(current, log){ return log.flowIntensity!=='none' && current && this.daysBetween(current.startDate,log.date)>=10; },
    estimatePregnancyRisk(prediction, dailyLogs){
      if(!prediction.ovulation) return {probability:0,level:'low',label:'Sin datos'};
      const encounters=dailyLogs.filter(log=>log.hadSex);
      if(!encounters.length) return {probability:0,level:'low',label:'Sin actividad registrada'};
      let combinedNotPregnant=1;
      encounters.forEach(log=>{
        const diff=Math.abs(this.daysBetween(log.date,prediction.ovulation));
        const inFertile=log.date>=prediction.fertileStart && log.date<=prediction.fertileEnd;
        let chance=0.01;
        if(inFertile){
          if(diff===0) chance=0.33;
          else if(diff===1) chance=0.30;
          else if(diff===2) chance=0.27;
          else if(diff===3) chance=0.20;
          else chance=0.12;
        } else if(diff<=7) chance=0.04;
        if(log.protectionUsed===true) chance*=0.25;
        if(log.protectionUsed===null) chance*=0.85;
        combinedNotPregnant*= (1-Math.min(chance,0.95));
      });
      const probability=Math.round((1-combinedNotPregnant)*100);
      const level=probability>=20?'high':probability>=8?'medium':'low';
      const label=level==='high'?'Probabilidad alta':level==='medium'?'Probabilidad media':'Probabilidad baja';
      return {probability,level,label};
    }
  };

  async function saveDailyLog(data){
    const user=(await supabase.auth.getUser()).data.user;
    const current=MenstrualEngineService.getCurrentCycle(state.menstrual.cycles);
    const log={
      user_id:user.id,
      date:data.date,
      flow_intensity:data.flowIntensity,
      symptoms:data.symptoms||[],
      mood:data.mood||[],
      had_sex:!!data.hadSex,
      protection_used:data.hadSex ? !!data.protectionUsed : null
    };
    const {error:logError}=await supabase.from('daily_logs').upsert(log,{onConflict:'user_id,date'});
    if(logError) throw logError;
    if(!current && data.flowIntensity!=='none'){
      const {error:firstCycleError}=await supabase.from('cycles').insert({user_id:user.id,start_date:data.date});
      if(firstCycleError) throw firstCycleError;
    }
    if(MenstrualEngineService.shouldCloseCycle(current,data)){
      const {error:closeError}=await supabase.from('cycles').update({end_date:data.date,cycle_length:MenstrualEngineService.daysBetween(current.startDate,data.date)}).eq('id',current.id);
      if(closeError) throw closeError;
      const {error:newCycleError}=await supabase.from('cycles').insert({user_id:user.id,start_date:data.date});
      if(newCycleError) throw newCycleError;
    }
    await loadData();
  }

  async function removeDailyLog(id){
    const log=state.menstrual.dailyLogs.find(item=>item.id===id);
    const current=MenstrualEngineService.getCurrentCycle(state.menstrual.cycles);
    const {error}=await supabase.from('daily_logs').delete().eq('id',id);
    if(error) throw error;
    if(log && current && current.startDate===log.date){
      const {error:cycleError}=await supabase.from('cycles').delete().eq('id',current.id);
      if(cycleError) throw cycleError;
    }
    await loadData();
  }

  async function createFirstCycle(date){
    const user=(await supabase.auth.getUser()).data.user;
    const current=MenstrualEngineService.getCurrentCycle(state.menstrual.cycles);
    if(current) return;
    const {error}=await supabase.from('cycles').insert({user_id:user.id,start_date:date});
    if(error) throw error;
    await loadData();
  }

  /* ---------------- HELPERS ---------------- */
  function fmtMoney(n){
    n = Number(n)||0;
    return n.toLocaleString('es-MX', {style:'currency', currency:'MXN', maximumFractionDigits:0});
  }
  function fmtDate(d){
    const dt = new Date(d + 'T00:00:00');
    return dt.toLocaleDateString('es-MX', {day:'numeric', month:'short', year:'numeric'});
  }
  function monthsBetween(a,b){
    let months = (b.getFullYear()-a.getFullYear())*12 + (b.getMonth()-a.getMonth());
    if(b.getDate() < a.getDate()) months -= 1;
    return months;
  }
  function todayISO(){
    const d = new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }

  function computeQuote(plan){
    const today = new Date();
    const target = new Date(plan.targetDate + 'T00:00:00');
    const created = new Date(plan.createdAt + 'T00:00:00');
    const saved = plan.contributions.reduce((s,c)=>s+Number(c.amount),0) + Number(plan.initial||0);
    const cost = Number(plan.targetCost)||0;
    const remaining = Math.max(0, cost - saved);
    let monthsLeft = monthsBetween(today, target);
    monthsLeft = monthsLeft < 1 ? 1 : monthsLeft;
    const overdue = target < today && saved < cost;
    const monthly = overdue ? remaining : remaining / monthsLeft;
    const weekly = monthly / 4.345;
    const totalMonths = Math.max(1, monthsBetween(created, target));
    const elapsedMonths = Math.max(0, monthsBetween(created, today));
    const expectedFrac = Math.min(1, elapsedMonths/totalMonths);
    const actualFrac = cost > 0 ? Math.min(1, saved/cost) : 0;
    let status = 'ok';
    if(saved >= cost && cost>0) status = 'done';
    else if(overdue) status = 'warn';
    else if(actualFrac < expectedFrac - 0.12) status = 'warn';
    return { saved, cost, remaining, monthsLeft, monthly, weekly, pct: cost>0 ? Math.min(100, Math.round((saved/cost)*100)) : 0, status, overdue };
  }

        <div class="quote-row"><span>Falta por ahorrar</span><b>${fmtMoney(q.remaining)}</b></div>
        <div class="quote-row"><span>Fecha objetivo</span><b>${fmtDate(p.targetDate)}</b></div>
        <div class="quote-row"><span>Tiempo restante</span><b>${q.overdue? 'Vencido' : q.monthsLeft+' mes(es)'}</b></div>
        <div class="quote-highlight">
          <div class="quote-row"><span>Ahorra al mes</span><b>${fmtMoney(q.monthly)}</b></div>
          <div class="quote-row"><span>Ahorra a la semana</span><b>${fmtMoney(q.weekly)}</b></div>
        </div>
      </div>

      <h3 class="agenda-title">Historial de aportes</h3>
      <div class="contrib-list">
        ${contribs.length ? contribs.map(c=>`<div class="contrib-item">
          <div class="contrib-item-main"><span>${fmtDate(c.date)}${c.note? ' · '+escapeHtml(c.note):''}</span><b>${fmtMoney(c.amount)}</b></div>
          <div class="contrib-actions"><button class="contrib-action" data-action="edit-contribution" data-id="${c.id}" title="Editar">Editar</button><button class="contrib-action delete" data-action="delete-contribution" data-id="${c.id}" title="Eliminar">✕</button></div>
        </div>`).join('') : `<div class="muted-empty">Aún no registras aportes.</div>`}
      </div>

      <div class="modal-actions">
        <button class="btn btn-ghost" data-action="edit-plan" data-id="${p.id}">Editar plan</button>
        <button class="btn btn-gold" data-action="contribute" data-id="${p.id}">${iconPlus()} Registrar aporte</button>
      </div>
    `);
  }

  function openContribute(id){
    const p = state.plans.find(x=>x.id===id);
    if(!p) return;
    openModal(`
      <div class="modal-head">
        <h2 class="modal-title">Registrar aporte</h2>
        <button class="modal-close" data-action="close-modal">✕</button>
      </div>
      <p style="color:var(--ink-soft);font-size:13.5px;margin-top:-6px;">Para <b>${escapeHtml(p.name)}</b></p>
      <form id="contribForm">
        <div class="field">
          <label>Monto</label>
          <input type="number" name="amount" min="0.01" step="0.01" required placeholder="$0" autofocus>
        </div>
        <div class="field">
          <label>Fecha</label>
          <input type="date" name="date" required value="${todayISO()}">
        </div>
        <div class="field">
          <label>Nota (opcional)</label>
          <input type="text" name="note" placeholder="Ej. Aguinaldo, quincena...">
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" data-action="close-modal">Cancelar</button>
          <button type="submit" class="btn btn-primary">Guardar aporte</button>
        </div>
      </form>
    `);
    document.getElementById('contribForm').addEventListener('submit', async(e)=>{
      e.preventDefault();
      const fd = new FormData(e.target);
      const data = Object.fromEntries(fd.entries());
      try{
        await createContribution(p.id, data);
        await loadData();
        showToast('Aporte guardado');
        closeModal();
        render();
      }catch(error){ showToast('No se pudo guardar el aporte.'); }
    });
  }

  function openEditContribution(planId, contributionId){
    const plan = state.plans.find(item=>item.id===planId);
    const contribution = plan?.contributions.find(item=>item.id===contributionId);
    if(!plan || !contribution) return;
    openModal(`
      <div class="modal-head"><h2 class="modal-title">Editar aporte</h2><button class="modal-close" data-action="close-modal">✕</button></div>
      <p style="color:var(--ink-soft);font-size:13.5px;margin-top:-6px;">Para <b>${escapeHtml(plan.name)}</b></p>
      <form id="editContributionForm">
        <div class="field"><label>Monto</label><input type="number" name="amount" min="0.01" step="0.01" required value="${contribution.amount}"></div>
        <div class="field"><label>Fecha</label><input type="date" name="date" required value="${contribution.date}"></div>
        <div class="field"><label>Nota (opcional)</label><input type="text" name="note" value="${escapeHtml(contribution.note||'')}"></div>
        <div class="modal-actions"><button type="button" class="btn btn-ghost" data-action="close-modal">Cancelar</button><button type="submit" class="btn btn-primary">Guardar cambios</button></div>
      </form>
    `);
    document.getElementById('editContributionForm').addEventListener('submit', async(e)=>{
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target).entries());
      try{ await updateContribution(contributionId,data); await loadData(); showToast('Aporte actualizado'); openDetail(planId); }
      catch(error){ showToast('No se pudo actualizar el aporte.'); }
    });
  }

  async function deleteContribution(planId, contributionId){
    if(!confirm('¿Eliminar este aporte?')) return;
    try{ await removeContribution(contributionId); await loadData(); showToast('Aporte eliminado'); openDetail(planId); }
    catch(error){ showToast('No se pudo eliminar el aporte.'); }
  }

  function openActivityForm(date){
    activeActivityDate = date;
    const activities = state.activities.filter(activity=>activity.date===date).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
    openModal(`
      <div class="modal-head">
        <h2 class="modal-title">Actividades del ${fmtDate(date)}</h2>
        <button class="modal-close" data-action="close-modal">✕</button>
      </div>
      <div class="activity-list">
        ${activities.length ? activities.map(activity=>`<div class="activity-item">
          <span class="activity-item-dot" style="--activity-color:${activityColor(activity.color)}"></span>
          <div class="activity-item-body"><div class="activity-item-title">${escapeHtml(activity.title)}</div><div class="activity-item-meta">${activity.time||'Sin hora'}${activity.note?' · '+escapeHtml(activity.note):''}</div>${activity.reminderAt?`<div class="activity-reminder">⏰ ${escapeHtml(formatReminderText(activity.reminderAt))}</div>`:''}</div>
          <button class="activity-delete" data-action="delete-activity" data-id="${activity.id}" title="Eliminar">✕</button>
        </div>`).join('') : '<div class="muted-empty">Todavía no hay actividades este día.</div>'}
      </div>
      <h3 class="agenda-title">Agregar actividad</h3>
      <form id="activityForm">
        <div class="field"><label>Actividad</label><input type="text" name="title" required maxlength="80" placeholder="Ej. Comprar boletos"></div>
        <div class="field-row"><div class="field"><label>Hora (opcional)</label><input type="time" name="time"></div><div class="field"><label>Color</label><select name="color"><option value="gold">Dorado</option><option value="teal">Verde</option><option value="coral">Coral</option><option value="sage">Salvia</option></select></div></div>
        <div class="field"><label>Nota (opcional)</label><input type="text" name="note" maxlength="120" placeholder="Un detalle breve"></div>
        <div class="field"><div class="sex-toggle"><label for="reminderEnabled">Activar recordatorio</label><input id="reminderEnabled" type="checkbox" name="reminderEnabled"></div><input id="reminderAtInput" type="datetime-local" name="reminderAt" step="60" min="${localDateTimeForInput(new Date())}" disabled></div>
        <div class="modal-actions"><button type="button" class="btn btn-ghost" data-action="close-modal">Cerrar</button><button type="submit" class="btn btn-primary">Agregar actividad</button></div>
      </form>
    `);
    const reminderToggle = document.getElementById('reminderEnabled');
    const reminderInput = document.getElementById('reminderAtInput');
    reminderToggle.addEventListener('change', ()=>{
      const enabled = reminderToggle.checked;
      reminderInput.disabled = !enabled;
      if(enabled && !reminderInput.value) {
        reminderInput.value = localDateTimeForInput(new Date());
      }
    });
    document.getElementById('activityForm').addEventListener('submit', async(e)=>{
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target).entries());
      data.date = date;
      try{ await createActivity(data); showToast('Actividad agregada'); closeModal(); render(); }
      catch(error){ showToast('No se pudo guardar la actividad.'); }
    });
  }

  function openDailyTracking(date){
    const existing=state.menstrual.dailyLogs.find(log=>log.date===date);
    const selectedFlow=existing?.flowIntensity||'none';
    const hadSex=!!existing?.hadSex;
    const protectionUsed=existing?.protectionUsed===true;
    const flow=FLOW_OPTIONS.map(([value,label])=>`<label><input type="radio" name="flowIntensity" value="${value}" ${selectedFlow===value?'checked':''}><span>${label}</span></label>`).join('');
    const choices=(items,selected,name)=>items.map(([value,label])=>`<label><input type="checkbox" name="${name}" value="${value}" ${(selected||[]).includes(value)?'checked':''}><span>${label}</span></label>`).join('');
    openModal(`<div class="modal-head"><h2 class="modal-title">Registro del ${fmtDate(date)}</h2><button class="modal-close" data-action="close-modal">✕</button></div>
      <form id="dailyTrackingForm"><div class="field"><label>Flujo</label><div class="choice-grid">${flow}</div></div><div class="field"><label>Estado de ánimo</label><div class="chip-grid">${choices(MOOD_OPTIONS,existing?.mood,'mood')}</div></div><div class="field"><label>Síntomas</label><div class="chip-grid">${choices(SYMPTOM_OPTIONS,existing?.symptoms,'symptoms')}</div></div><div class="field"><div class="sex-toggle"><label for="hadSex">¿Hubo relaciones sexuales este día?</label><input id="hadSex" type="checkbox" name="hadSex" ${hadSex?'checked':''}></div><div class="sex-toggle" id="protectionRow" style="display:${hadSex?'flex':'none'};"><label for="protectionUsed">¿Se cuidaron?</label><input id="protectionUsed" type="checkbox" name="protectionUsed" ${protectionUsed?'checked':''}></div></div><div class="modal-actions">${existing?`<button type="button" class="btn btn-ghost" data-action="delete-daily-log" data-id="${existing.id}" style="color:var(--coral);margin-right:auto;">Eliminar</button>`:''}<button type="button" class="btn btn-ghost" data-action="close-modal">Cancelar</button><button type="submit" class="btn btn-primary">Guardar registro</button></div></form>`);
    const hadSexInput=document.getElementById('hadSex');
    const protectionRow=document.getElementById('protectionRow');
    hadSexInput.addEventListener('change',()=>{
      protectionRow.style.display=hadSexInput.checked?'flex':'none';
      if(!hadSexInput.checked) document.getElementById('protectionUsed').checked=false;
    });
    document.getElementById('dailyTrackingForm').addEventListener('submit',async(event)=>{
      event.preventDefault();
      const form=new FormData(event.target);
      const hadSexNow=form.get('hadSex')==='on';
      const data={date,flowIntensity:form.get('flowIntensity')||'none',mood:form.getAll('mood'),symptoms:form.getAll('symptoms'),hadSex:hadSexNow,protectionUsed:hadSexNow ? form.get('protectionUsed')==='on' : null};
      try{ await saveDailyLog(data); showToast('Registro guardado'); closeModal(); render(); }
      catch(error){ showToast('No se pudo guardar el registro.'); }
    });
  }

  function deletePlan(id){
    if(!confirm('¿Eliminar este plan y su historial de aportes?')) return;
    removePlan(id).then(async()=>{
      await loadData();
      closeModal();
      render();
    }).catch(()=>showToast('No se pudo eliminar el plan.'));
  }

  /* ---------------- EVENTS ---------------- */
  function attachViewEvents(){
    document.querySelectorAll('[data-action="goto-plans"]').forEach(b=>b.addEventListener('click', ()=>setView('plans')));
    document.querySelectorAll('[data-action="cal-prev"]').forEach(b=>b.addEventListener('click', ()=>{ calDate.setMonth(calDate.getMonth()-1); render(); }));
    document.querySelectorAll('[data-action="cal-next"]').forEach(b=>b.addEventListener('click', ()=>{ calDate.setMonth(calDate.getMonth()+1); render(); }));
    document.querySelectorAll('[data-action="cal-today"]').forEach(b=>b.addEventListener('click', ()=>{ calDate = new Date(); render(); }));
    document.querySelectorAll('[data-action="cycle-prev"]').forEach(b=>b.addEventListener('click', ()=>{ calDate.setMonth(calDate.getMonth()-1); render(); }));
    document.querySelectorAll('[data-action="cycle-next"]').forEach(b=>b.addEventListener('click', ()=>{ calDate.setMonth(calDate.getMonth()+1); render(); }));
    document.querySelectorAll('[data-action="cycle-today"]').forEach(b=>b.addEventListener('click', ()=>{ calDate = new Date(); render(); }));
  }

  document.getElementById('nav').addEventListener('click', (e)=>{
    const btn = e.target.closest('.nav-item');
    if(btn) setView(btn.dataset.view);
  });

  document.addEventListener('click', (e)=>{
    const btn = e.target.closest('[data-action]');
    if(!btn) return;
    const action = btn.dataset.action;
    const id = btn.dataset.id;
    if(action==='new-plan') openPlanForm(null);
    else if(action==='edit-plan') openPlanForm(state.plans.find(p=>p.id===id));
    else if(action==='view-plan') openDetail(id);
    else if(action==='contribute') openContribute(id);
    else if(action==='delete-plan') deletePlan(id);
    else if(action==='add-activity') openActivityForm(btn.dataset.date);
    else if(action==='daily-log') openDailyTracking(btn.dataset.date);
    else if(action==='delete-daily-log'){
      if(confirm('¿Eliminar este registro diario?')) removeDailyLog(id).then(()=>{ showToast('Registro eliminado'); closeModal(); render(); }).catch(()=>showToast('No se pudo eliminar el registro.'));
    }
    else if(action==='delete-activity') removeActivity(id).then(async()=>{ await loadData(); openActivityForm(activeActivityDate); }).catch(()=>showToast('No se pudo eliminar la actividad.'));
    else if(action==='edit-contribution'){
      const plan = state.plans.find(item=>item.contributions.some(contribution=>contribution.id===id));
      if(plan) openEditContribution(plan.id,id);
    }
    else if(action==='delete-contribution'){
      const plan = state.plans.find(item=>item.contributions.some(contribution=>contribution.id===id));
      if(plan) deleteContribution(plan.id,id);
    }
    else if(action==='sign-out') supabase.auth.signOut();
    else if(action==='close-modal') closeModal();
  });

  document.getElementById('overlay').addEventListener('click', (e)=>{
    if(e.target.id==='overlay') closeModal();
  });
  document.addEventListener('keydown', (e)=>{
    if(e.key==='Escape') closeModal();
  });

  /* ---------------- INIT ---------------- */
  async function init(){
    try{
      const configResponse = await fetch('/api/config');
      const config = await configResponse.json();
      if(!config.url || !config.anonKey) throw new Error('Configuración ausente');
      supabase = window.supabase.createClient(config.url, config.anonKey);
      supabase.auth.onAuthStateChange(async(_event, session)=>{
        const authenticated = !!session;
        if(!authenticated){
          document.querySelector('.app').style.display = 'none';
          document.getElementById('authScreen').style.display = 'flex';
          return;
        }
        currentUserEmail = session.user.email;
        try{
          await loadData();
          document.querySelector('.app').style.display = 'flex';
          document.getElementById('authScreen').style.display = 'none';
          currentUserEmail = session.user.email;
          subscribeToChanges();
          render();
        }catch(error){
          document.querySelector('.app').style.display = 'none';
          document.getElementById('authScreen').style.display = 'flex';
          document.getElementById('authError').textContent = 'La sesión es válida, pero no se pudieron cargar los planes. Ejecuta el esquema SQL y revisa las políticas RLS.';
        }
      });
      const {data:{session}} = await supabase.auth.getSession();
      if(!session){
        document.querySelector('.app').style.display = 'none';
        document.getElementById('authScreen').style.display = 'flex';
      }
      document.getElementById('authForm').addEventListener('submit', async(e)=>{
        e.preventDefault();
        const errorElement = document.getElementById('authError');
        const submitButton = e.target.querySelector('button[type="submit"]');
        errorElement.textContent = '';
        submitButton.disabled = true;
        submitButton.textContent = 'Entrando...';
        try{
          const {error} = await supabase.auth.signInWithPassword({email:document.getElementById('authEmail').value.trim(),password:document.getElementById('authPassword').value});
          if(error) errorElement.textContent = authErrorMessage(error);
        }catch(error){
          errorElement.textContent = authErrorMessage(error);
        }finally{
          submitButton.disabled = false;
          submitButton.textContent = 'Entrar';
        }
      });
    }catch(error){
      document.getElementById('authScreen').style.display = 'flex';
      document.getElementById('authError').textContent = 'No se pudo cargar la configuración de Supabase. Revisa que Vercel Dev esté ejecutándose en http://localhost:3000.';
    }
  }
  init();

})();
</script>
</body>
</html>
